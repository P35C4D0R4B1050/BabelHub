# Configuración de sshd de VM-AUX (PLA-20, AM29, D19). Se copia a /etc/ssh/sshd_config.d/50-babelhub-aux.conf y se recarga sshd. La comprueba
# scripts/vm-aux/verificar-endurecimiento.sh (a diario y a mano tras cada cambio).
#
# VM-AUX es el salto SSH a las demás VMs: la persona responsable llega a VM-INVENTARIO con `ssh -J salto@vm-aux usuario@vm-inventario` y la
# llave privada se queda en su equipo. En VM-AUX no hay ninguna llave privada, el agente no se reenvía (quien se conecta no le presta sus
# llaves a VM-AUX) y el usuario `salto` solo puede abrir canales TCP hacia las direcciones privadas de las otras VMs, puerto 22.
# Reemplaza las direcciones de ejemplo por las reales (docs/02-arquitectura-de-software/05-despliegue.md §7) y los usuarios por los reales.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
PermitRootLogin no
PermitUserEnvironment no
AllowAgentForwarding no
AllowStreamLocalForwarding no
GatewayPorts no
PermitTunnel no
UsePAM yes
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 20
ClientAliveInterval 120
ClientAliveCountMax 2

# Quién puede entrar: `salto` (solo salta) y `admin` (la persona responsable, con shell, para mantener VM-AUX).
AllowUsers salto admin

# El salto no tiene terminal ni comando: solo reenvía conexiones TCP a las otras VMs (ni sockets Unix de esta VM, ni túneles, ni puertos abiertos
# al exterior). El destino no se puede cambiar desde el cliente. UsePAM es necesario para la alerta de ingreso SSH (pam_exec).
Match User salto
    PermitTTY no
    ForceCommand /usr/sbin/nologin
    AllowTcpForwarding local
    PermitOpen 10.0.1.10:22 10.0.2.10:22
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    GatewayPorts no
    PermitTunnel no
