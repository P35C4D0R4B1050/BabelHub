# Control de acceso de PostgreSQL de VM-INVENTARIO (AM24, docs/02-arquitectura-de-software/05-despliegue.md §4 y §5). Va dentro de la imagen
# (/opt/babelhub/pg_hba.conf, solo lectura) y el Compose lo fija con `-c hba_file=…`: el que crea initdb no se usa.
#
# Regla de fondo: TODA conexión que llega por la red (la de la otra VM, la de los servicios de esta VM por la red de Docker y el migrador) debe ir cifrada con
# TLS y con la contraseña de su cuenta (scram-sha-256). Una conexión sin TLS no coincide con ninguna línea `hostssl` y la última línea la rechaza, así que
# la contraseña nunca viaja en claro por la red privada. Los clientes además VERIFICAN al servidor (SSL Mode=VerifyFull / sslmode=verify-full con la CA privada).
#
# TIPO    BASE        CUENTA      ORIGEN   MÉTODO
# Solo dentro del contenedor, por el socket de Unix (la comprobación de salud, la creación de las bases, el respaldo y el archivado de cambios): no sale a la red.
local     all         all                  trust
local     replication all                  trust
# Por la red, solo con TLS y solo a la base que corresponde. `evolution` es la base técnica de Evolution API y solo la abre su cuenta.
hostssl   ecommerce   all         all      scram-sha-256
hostssl   inventario  all         all      scram-sha-256
hostssl   evolution   evolution   all      scram-sha-256
# Todo lo demás, con o sin TLS (cualquier otra base, la replicación por la red y cualquier conexión sin cifrar), se rechaza.
host      all         all         all      reject
