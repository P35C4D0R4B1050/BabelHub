# Infraestructura local de BabelHub: base de datos y caché.
# Los servicios .NET y la Web se agregan aquí a medida que existan sus Dockerfiles.
# El emulador de almacén S3 se elige en el bloqueo B02 (ver progress/blockers.md).
#
# Uso:
#   cp .env.example .env        (y cambia las contraseñas de ejemplo)
#   docker compose -f infra/docker-compose.local.yml --env-file .env up -d
name: babelhub

services:
  postgres:
    # Una instancia con una base y un rol por servicio: ecommerce e inventario (AD03). Identidad es un esquema de ecommerce (AD18).
    # Igual que en VM-INVENTARIO; `infra/postgres/init/` crea las bases la primera vez que arranca el volumen.
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Define POSTGRES_ADMIN_PASSWORD en .env}
      POSTGRES_ECOMMERCE_PASSWORD: ${POSTGRES_ECOMMERCE_PASSWORD:?Define POSTGRES_ECOMMERCE_PASSWORD en .env}
      POSTGRES_INVENTARIO_PASSWORD: ${POSTGRES_INVENTARIO_PASSWORD:?Define POSTGRES_INVENTARIO_PASSWORD en .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    # Caché de disponibilidad y catálogo (AD06), con memoria acotada (RNF12).
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis-contadores:
    # Contadores de límites de uso (transversal-seguridad): instancia dedicada, sin expulsión de claves, con AOF y un usuario ACL
    # restringido. La contraseña (32 caracteres o más) llega por variable de entorno; en el despliegue se activa TLS (REDIS_TLS=1).
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    entrypoint: ["sh", "/etc/redis-contadores/iniciar.sh"]
    environment:
      BABELHUB__Seguridad__ClaveDeRedisDeLimites: ${BABELHUB__Seguridad__ClaveDeRedisDeLimites:?define una contraseña de al menos 32 caracteres}
      REDIS_TLS: ${REDIS_TLS:-0}
    volumes:
      - ./redis-contadores:/etc/redis-contadores:ro
    ports:
      - "127.0.0.1:${REDIS_CONTADORES_PORT:-6380}:6379"
    restart: unless-stopped

volumes:
  postgres-data:
