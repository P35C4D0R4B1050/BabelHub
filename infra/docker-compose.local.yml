# Infraestructura local de BabelHub: base de datos y caché.
# Los servicios .NET y la Web se agregan aquí a medida que existan sus Dockerfiles.
# El emulador de almacén S3 se elige en el bloqueo B02 (ver progress/blockers.md).
#
# Uso:
#   cp .env.example .env        (y cambia las contraseñas de ejemplo)
#   docker compose -f infra/docker-compose.local.yml --env-file .env up -d
name: babelhub

services:
  postgres:
    # Una instancia con una base y un rol por servicio: ecommerce, inventario e identidad (AD03, AD18).
    # Igual que en VM-DATOS; `infra/postgres/init/` crea las bases la primera vez que arranca el volumen.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Define POSTGRES_ADMIN_PASSWORD en .env}
      POSTGRES_ECOMMERCE_PASSWORD: ${POSTGRES_ECOMMERCE_PASSWORD:?Define POSTGRES_ECOMMERCE_PASSWORD en .env}
      POSTGRES_INVENTARIO_PASSWORD: ${POSTGRES_INVENTARIO_PASSWORD:?Define POSTGRES_INVENTARIO_PASSWORD en .env}
      POSTGRES_IDENTIDAD_PASSWORD: ${POSTGRES_IDENTIDAD_PASSWORD:?Define POSTGRES_IDENTIDAD_PASSWORD en .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    # Caché de disponibilidad y catálogo (AD06), con memoria acotada (RNF12).
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
