# Redis dedicado de contadores de límites (transversal-seguridad, T13; docs/02 §presupuesto de recursos).
# Aparte del Redis de caché y de Evolution (allkeys-lru): aquí nunca se expulsa una clave en silencio.
maxmemory 100mb
maxmemory-policy noeviction
appendonly yes
appendfsync everysec
save ""
aclfile /tmp/users.acl
