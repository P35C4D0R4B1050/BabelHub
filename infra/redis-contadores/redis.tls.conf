# Despliegue (VM-VENTAS): solo TLS en el puerto 6380; los certificados llegan como secretos montados.
port 0
tls-port 6380
tls-cert-file /run/secrets/redis-contadores-cert.pem
tls-key-file /run/secrets/redis-contadores-key.pem
tls-ca-cert-file /run/secrets/redis-contadores-ca.pem
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
