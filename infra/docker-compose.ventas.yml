# VM-VENTAS (ARM, 1 OCPU y 6 GB): la entrada pública (cloudflared y Nginx), E-commerce, Redis (caché y contadores), n8n y Evolution API (AD11).
# Topología de DOS VMs (DD-100): no hay VM-BORDE; es el respaldo previsto en B11, aquí por falta de capacidad AMD micro en la región.
# Se levanta con un solo comando y sus secretos (PLA-04). En la VM, siempre con el script (no con `docker compose up` a mano: además pone la regla
# que deja llegar a la réplica de gestión solo a Nginx, DD-104):
#   BABELHUB_SECRETOS=/etc/babelhub/secretos IP_PRIVADA=10.0.0.10 IP_INVENTARIO=10.0.0.20 IMAGEN_ECOMMERCE=<imagen@sha256:…> \
#   scripts/desplegar.sh ventas
# Reglas de PLA-26 y PLA-27: ver docker-compose.inventario.yml. Los paneles de n8n y Evolution API solo se alcanzan por túnel SSH
# (se publican en 127.0.0.1); Redis no se publica salvo el de contadores, por TLS y en la dirección privada, para la réplica de gestión.
#
# La IP del cliente no se puede falsificar (SEG-17, SEG-23, DD-101): el camino público es cloudflared -> Nginx -> E-commerce, cada salto en una
# red propia donde solo están sus dos extremos. Nginx cree CF-Connecting-IP SOLO de la dirección fija de cloudflared (infra/nginx/nginx.conf) y
# el E-commerce cree X-Origen-Cliente SOLO de la dirección fija de Nginx (BABELHUB__Ecommerce__ProxiesConocidos, aquí abajo). Ni n8n ni
# Evolution API están en esas redes. Nada de este camino publica un puerto: tampoco pasa por la dirección privada de la propia VM.
# Las direcciones fijas son de cloudflared y Nginx; el E-commerce NO lleva una (con ella, `docker compose run` fallaría con «Address already in
# use» mientras el servicio corre: así se ejecutan cuenta-de-prueba, crear-administrador y cargar-catalogo), y `ip_range` reserva las fijas.
name: babelhub-ventas

x-excepciones:
  - servicio: evolution-api
    regla: usuario-no-administrador
    motivo: La imagen de terceros corre como administrador dentro del contenedor y escribe en /evolution/instances y en su caché de Node; no se verificó que arranque con otro usuario.
    mitigacion: Sin capacidades (todas descartadas) ni posibilidad de ganarlas, sin modo privilegiado ni socket del motor, sin puertos publicados fuera de 127.0.0.1, red propia solo con Redis y la base técnica, límites de memoria y procesador, y el número de WhatsApp dedicado y descartable (B07). Se revisa al implementar transversal-notificaciones.
  - servicio: evolution-api
    regla: sistema-de-archivos-de-solo-lectura
    motivo: Guarda las sesiones de WhatsApp y archivos temporales en rutas del contenedor que la imagen no separa en un volumen.
    mitigacion: Volumen propio para /evolution/instances, el resto del contenedor sin datos de negocio, y la base de Evolution se descarta al restaurar y se vuelve a emparejar el número (plan §5.1 paso 6).

x-registro: &registro
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    # nginx-unprivileged: la variante oficial que corre como un usuario sin privilegios en el puerto 8080. No publica ningún puerto: solo lo
    # alcanza cloudflared por la red `tunel`. Llega al E-commerce por la red `entrada` y a la réplica de gestión por la dirección privada de
    # VM-INVENTARIO (puerto 8081 de la lista de seguridad).
    image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101,mode=0755
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # El upstream «ecommerce» de nginx.conf es el servicio de este mismo Compose; «ecommerce-gestion» es la réplica en VM-INVENTARIO (8081).
    extra_hosts:
      - "ecommerce-gestion:${IP_INVENTARIO:?Define IP_INVENTARIO con la dirección privada de VM-INVENTARIO}"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      tunel:
        ipv4_address: 10.213.10.3
      entrada:
        ipv4_address: 10.213.11.2
    mem_limit: 64m
    cpus: 0.2
    pids_limit: 50
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging: *registro
    restart: unless-stopped

  ecommerce:
    image: ${IMAGEN_ECOMMERCE:?Define IMAGEN_ECOMMERCE con el digest de la imagen publicada}
    user: "1654:1654"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # PAG-34: ASPNETCORE_ENVIRONMENT NO se fija aquí: lo define ecommerce.env (Staging mientras Culqi revisa la tienda, sin pasarela «ninguna» o, para las pruebas con personas, con la simulada; Production con las llaves de Culqi). Es el único lugar que cambia al pasar
      # de uno a otro, y desplegar.sh se niega si falta, si no es Staging o Production o si no es coherente con BABELHUB__Pagos__Pasarela. Sin valor, la imagen arranca como Production y la guarda exige la pasarela real.
      # El rol del proceso (web-base, D03). BABELHUB__Web__HostsPermitidos (los hosts que acepta el servidor) va en ecommerce.env: sin él el servicio no arranca.
      BABELHUB__Web__Host: tienda
      # DD-55: HTTPS entre servicios en Production (guardas de arranque y docs/05): el Inventario llama a este servicio por https://<IP privada>:8443 (avisos de traslado). Kestrel escucha también en 8443 con el
      # certificado de la red privada y la raíz de confianza es la de la VM más la CA privada (ca-bundle.pem, que arma desplegar.sh). Nginx sigue entrando por el 8080.
      # El origen del cliente (X-Origen-Cliente) solo se acepta de la dirección fija de Nginx en la red `entrada` (SEG-17, DD-101). Es un dato de la
      # topología, no un secreto: va aquí y manda sobre lo que diga ecommerce.env (una carpeta de secretos antigua no puede ampliar la confianza).
      BABELHUB__Ecommerce__ProxiesConocidos: "10.213.11.2"
      ASPNETCORE_HTTPS_PORTS: "8443"
      Kestrel__Certificates__Default__Path: /run/secrets/tls-cert.pem
      Kestrel__Certificates__Default__KeyPath: /run/secrets/tls-key.pem
      SSL_CERT_FILE: /run/secrets/ca-bundle.pem
    env_file:
      - "${BABELHUB_SECRETOS:?Define BABELHUB_SECRETOS con la carpeta de los secretos de esta VM}/ecommerce.env"
    # Solo el HTTPS entre servicios se publica (el Inventario pide avisos). El 8080 no: Nginx entra por la red `entrada` y n8n por la general.
    ports:
      - "${IP_PRIVADA:?Define IP_PRIVADA con la dirección privada de esta VM}:8443:8443"
    secrets:
      - source: tls-ecommerce-cert.pem
        target: tls-cert.pem
      - source: tls-ecommerce-key.pem
        target: tls-key.pem
      - ca-bundle.pem
    mem_limit: 600m
    cpus: 0.6
    pids_limit: 300
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # `default`: Redis, n8n y la salida hacia VM-INVENTARIO e Internet. `entrada`: solo Nginx.
    networks:
      default:
      entrada:
    depends_on:
      redis:
        condition: service_healthy
      redis-contadores:
        condition: service_healthy
    logging: *registro
    restart: unless-stopped

  redis:
    # Caché de disponibilidad y del catálogo, y datos de Evolution API: se puede perder y se expulsa lo menos usado (AD06).
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    user: redis
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - "${BABELHUB_SECRETOS:?}/redis.env"
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_CACHE_PASSWORD\" --maxmemory 100mb --maxmemory-policy allkeys-lru --save \"\" --appendonly no"]
    mem_limit: 128m
    cpus: 0.1
    pids_limit: 50
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_CACHE_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *registro
    restart: unless-stopped

  redis-contadores:
    # Instancia dedicada de los contadores de límites (transversal-seguridad D17): sin expulsión, con AOF, ACL y solo TLS.
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    user: redis
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - "${BABELHUB_SECRETOS:?}/redis-contadores.env"
    environment:
      REDIS_TLS: "1"
    command: ["sh", "/etc/redis-contadores/iniciar.sh"]
    ports:
      - "${IP_PRIVADA:?}:6380:6380"
    volumes:
      - ./redis-contadores:/etc/redis-contadores:ro
      - redis-contadores-datos:/data
    secrets:
      - redis-contadores-cert.pem
      - redis-contadores-key.pem
      - redis-contadores-ca.pem
    mem_limit: 100m
    cpus: 0.1
    pids_limit: 50
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /run/secrets/redis-contadores-ca.pem -p 6380 ping 2>&1 | grep -qE 'PONG|NOAUTH|NOPERM'"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *registro
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.121.3@sha256:4f717fcf41f5ea596757173a60ce038707e4edf2c686e9934ae75cd5f5918d73
    user: node
    read_only: true
    # n8n crea /home/node/.cache al arrancar (ENOENT con el sistema de archivos de solo lectura y bucle de reinicios): se le da un tmpfs, sin quitar el solo lectura.
    # El tmpfs es del usuario «node» (1000): sin dueño queda de root y n8n no puede escribir en él (EACCES y el mismo bucle, visto en la VM).
    tmpfs:
      - /tmp
      - /home/node/.cache:uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - "${BABELHUB_SECRETOS:?}/n8n.env"
    environment:
      N8N_PORT: "5678"
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Notificaciones (T17, T18): el flujo verifica la firma con las claves de n8n.env (BABELHUB_FIRMA_DE_AVISOS y BABELHUB_FIRMA_DE_ESTADOS) y arma el mensaje con crypto; el historial de ejecuciones, que trae números, se purga a las 168 horas y las ejecuciones correctas no se guardan.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: "crypto"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n-datos:/home/node/.n8n
    mem_limit: 600m
    cpus: 0.4
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *registro
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7@sha256:1bd8afc4a6cf48822e6cf02469aeae7bd35a12a6b616eacd1291926307f4d339
    # Corre como administrador dentro del contenedor y con sistema de archivos escribible: ver x-excepciones.
    user: root
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - "${BABELHUB_SECRETOS:?}/evolution.env"
    environment:
      # Evolution no guarda mensajes, contactos ni chats (T18; NOT-06, NOT-07): solo la sesión de WhatsApp. El historial de n8n se purga a las 168 horas.
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - evolution-instancias:/evolution/instances
    # TLS hacia PostgreSQL de VM-INVENTARIO (AM24): la CA privada para verificar al servidor (DATABASE_CONNECTION_URI lleva sslcert=/run/secrets/tls-ca.pem; ver generar-secretos.sh).
    secrets:
      - tls-ca.pem
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 600m
    cpus: 0.4
    pids_limit: 200
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging: *registro
    restart: unless-stopped

  cloudflared:
    # El ÚNICO conector del túnel: entrega todo a http://nginx:8080 (el destino configurado en Cloudflare). No hay un segundo conector que
    # salte Nginx: por ese camino un cliente podría escribir su propia cabecera X-Origen-Cliente (DD-101). El token es un secreto de esta VM.
    image: cloudflare/cloudflared:2025.11.1@sha256:89ee50efb1e9cb2ae30281a8a404fed95eb8f02f0a972617526f8c5b417acae2
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - "${BABELHUB_SECRETOS:?}/cloudflared.env"
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:2000", "run"]
    networks:
      tunel:
        ipv4_address: 10.213.10.2
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 50
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      nginx:
        condition: service_healthy
    logging: *registro
    restart: unless-stopped

# Las redes de la entrada pública (DD-101). Los rangos quedan fuera de los que Docker reparte solo (172.16/12 y 192.168/16) y de la red privada
# de la nube (10.0.0.0/16). `ip_range` es de donde salen las direcciones dinámicas, de modo que nunca ocupen una fija.
networks:
  default:
  tunel:
    ipam:
      config:
        - subnet: 10.213.10.0/28
          ip_range: 10.213.10.8/29
  entrada:
    internal: true
    ipam:
      config:
        - subnet: 10.213.11.0/28
          ip_range: 10.213.11.8/29

secrets:
  tls-ca.pem:
    file: ${BABELHUB_SECRETOS:?}/tls-ca.pem
  tls-ecommerce-cert.pem:
    file: ${BABELHUB_SECRETOS:?}/tls-ecommerce-cert.pem
  tls-ecommerce-key.pem:
    file: ${BABELHUB_SECRETOS:?}/tls-ecommerce-key.pem
  ca-bundle.pem:
    file: ${BABELHUB_SECRETOS:?}/ca-bundle.pem
  redis-contadores-cert.pem:
    file: ${BABELHUB_SECRETOS:?}/redis-contadores-cert.pem
  redis-contadores-key.pem:
    file: ${BABELHUB_SECRETOS:?}/redis-contadores-key.pem
  redis-contadores-ca.pem:
    file: ${BABELHUB_SECRETOS:?}/redis-contadores-ca.pem

volumes:
  redis-contadores-datos:
  n8n-datos:
  evolution-instancias:
