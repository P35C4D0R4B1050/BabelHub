# VM-BORDE (AMD micro, 1/8 de OCPU y 1 GB): cloudflared y Nginx, la entrada pública (AD11, AD14). Solo reenvían tráfico.
# Se levanta con un solo comando y sus secretos (PLA-04):
#   BABELHUB_SECRETOS=/etc/babelhub/secretos IP_VENTAS=10.0.0.10 IP_INVENTARIO=10.0.1.10 \
#   docker compose -f infra/docker-compose.borde.yml up -d
# Reglas de PLA-26 y PLA-27: ver docker-compose.inventario.yml. Nada se publica fuera del contenedor: cloudflared llega a Nginx por la red de
# Compose y Nginx llega a las otras VMs por su dirección privada (el puerto 8080 del borde no se abre a Internet).
name: babelhub-borde

x-excepciones: []

x-registro: &registro
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    # nginx-unprivileged: la variante oficial que corre como un usuario sin privilegios en el puerto 8080.
    image: nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101,mode=0755
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Los upstream de nginx.conf se llaman «ecommerce» (VM-VENTAS, 8080) y «ecommerce-gestion» (réplica en VM-INVENTARIO, 8081).
    extra_hosts:
      - "ecommerce:${IP_VENTAS:?Define IP_VENTAS con la dirección privada de VM-VENTAS}"
      - "ecommerce-gestion:${IP_INVENTARIO:?Define IP_INVENTARIO con la dirección privada de VM-INVENTARIO}"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    mem_limit: 64m
    cpus: 0.08
    pids_limit: 50
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging: *registro
    restart: unless-stopped

  cloudflared:
    # El primer conector del túnel (el segundo está en VM-VENTAS). El token es un secreto de esta VM.
    image: cloudflare/cloudflared:2026.11.0@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - "${BABELHUB_SECRETOS:?Define BABELHUB_SECRETOS con la carpeta de los secretos de esta VM}/cloudflared.env"
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:2000", "run"]
    mem_limit: 64m
    cpus: 0.05
    pids_limit: 50
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      nginx:
        condition: service_healthy
    logging: *registro
    restart: unless-stopped
