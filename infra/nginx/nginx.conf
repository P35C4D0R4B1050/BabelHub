# Puerta de entrada interna (AD14): solo enruta. TLS lo termina Cloudflare en el borde (AD13).
# Plantilla: los nombres de los upstream coinciden con los servicios de Compose que se agregarán
# (web, ecommerce, inventario, identidad, asistente) y escuchan en el puerto 8080.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 5m;

    upstream web         { server web:8080; }
    upstream ecommerce   { server ecommerce:8080; }
    upstream inventario  { server inventario:8080; }
    upstream identidad   { server identidad:8080; }
    upstream asistente   { server asistente:8080; }

    map $http_x_correlation_id $correlacion {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    server {
        listen 8080;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Correlation-Id $correlacion;

        # Las API siguen enrutadas para futuros clientes (aplicación móvil) y pruebas de carga.
        # Siempre exigen JWT; la Web las llama por la red interna, no por aquí.
        location /api/ecommerce/  { proxy_pass http://ecommerce; }
        location /api/inventario/ { proxy_pass http://inventario; }
        location /api/identidad/  { proxy_pass http://identidad; }
        location /api/asistente/  { proxy_pass http://asistente; }

        location = /health { return 200 "ok\n"; add_header Content-Type text/plain; }

        location / { proxy_pass http://web; }
    }
}
