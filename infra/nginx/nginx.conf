# Puerta de entrada interna (AD14): solo enruta por host. TLS lo termina Cloudflare en el borde (AD13).
# Plantilla: en local los nombres de los upstream coinciden con los servicios de Compose que se agregarán
# (ecommerce y ecommerce-gestion) y escuchan en el puerto 8080. En las VMs de Oracle (VM-BORDE) el E-commerce
# y la réplica de gestión se indican por su dirección privada (docs/02-arquitectura-de-software/05-despliegue.md §4).
# El Inventario no tiene entrada pública: solo lo llama el E-commerce por la red privada.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 5m;

    # Límites por IP real del cliente (Cloudflare la envía en CF-Connecting-IP); AD24.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;   # en producción, solo los rangos de Cloudflare y del túnel
    limit_req_zone  $binary_remote_addr zone=por_ip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conexiones_por_ip:10m;

    upstream ecommerce {
        server ecommerce:8080;
    }

    # Gestión (Sucursal y Admin): el servidor principal y, como respaldo, la réplica de gestión
    # que corre en la VM del Inventario con la misma imagen.
    upstream gestion {
        server ecommerce:8080;
        server ecommerce-gestion:8080 backup;
    }

    map $http_x_correlation_id $correlacion {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    # Tienda: dominio principal.
    server {
        listen 8080 default_server;

        limit_req zone=por_ip burst=40 nodelay;
        limit_conn conexiones_por_ip 30;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Correlation-Id $correlacion;

        location = /health { return 200 "ok\n"; add_header Content-Type text/plain; }

        location / { proxy_pass http://ecommerce; }
    }

    # Gestión: subdominio del personal (cookies propias; protegido por Cloudflare Access).
    server {
        listen 8080;
        server_name gestion.*;

        limit_req zone=por_ip burst=20 nodelay;
        limit_conn conexiones_por_ip 20;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Correlation-Id $correlacion;

        location / {
            proxy_pass http://gestion;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
