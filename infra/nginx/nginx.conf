# Puerta de entrada interna (AD14): solo enruta por host. TLS lo termina Cloudflare en el borde (AD13).
# Corre en VM-VENTAS junto a cloudflared (topología de dos VMs, DD-100; docs/02-arquitectura-de-software/05-despliegue.md §3 y §4).
# La tienda es el servicio «ecommerce» del mismo Compose; la gestión es la réplica en VM-INVENTARIO («ecommerce-gestion», 8081).
# El Inventario no tiene entrada pública: solo lo llama el E-commerce por la red privada.

worker_processes auto;
# Sin privilegios y con el sistema de archivos de solo lectura (PLA-27): el pid va a un directorio escribible.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 5m;

    # Límites por IP real del cliente (Cloudflare la envía en CF-Connecting-IP); AD24.
    # SOLO se confía en esa cabecera cuando la conexión viene de la dirección fija de cloudflared en la red `tunel`
    # (infra/docker-compose.ventas.yml, DD-101). Ningún otro origen —tampoco otro contenedor ni la red privada— puede fijar la IP del cliente.
    # Nginx no publica ningún puerto.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 10.213.10.2;
    limit_req_zone  $binary_remote_addr zone=por_ip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conexiones_por_ip:10m;

    # La conexión viene del túnel de confianza (la misma dirección de set_real_ip_from): solo entonces vale CF-Connecting-IP.
    geo $realip_remote_addr $viene_del_tunel {
        default 0;
        10.213.10.2/32 1;
    }

    # La dirección del cliente final solo si CF-Connecting-IP es UNA dirección IPv4 o IPv6 de forma válida; si no, queda vacía y la
    # cabecera X-Origen-Cliente no se envía (la aplicación la trata como origen desconocido y lo registra).
    map "$viene_del_tunel:$http_cf_connecting_ip" $origen_del_cliente {
        default "";
        "~^1:([0-9]{1,3}(\.[0-9]{1,3}){3})$" $1;
        "~^1:([0-9a-fA-F:]{2,39})$" $1;
    }

    # País del cliente según Cloudflare: solo si la conexión viene del túnel de confianza (como el origen); si no, queda vacío y la cabecera no se envía.
    map "$viene_del_tunel:$http_cf_ipcountry" $region_del_borde {
        default "";
        "~^1:([A-Z]{2})$" $1;
    }

    # El nombre «ecommerce» se vuelve a resolver (DNS de Docker): si el contenedor se recrea con otra dirección, Nginx la sigue sin reiniciarse.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream ecommerce {
        zone ecommerce 64k;
        server ecommerce:8080 resolve;
    }

    # Gestión (Sucursal y Admin): el único proceso que la sirve es la réplica de gestión, en la VM del Inventario (puerto 8081,
    # docs/02/05 §7). El proceso de la tienda corre con el rol `tienda` y rechaza el host de gestión (web-base, D03; DD-102).
    upstream gestion {
        server ecommerce-gestion:8081;
    }

    map $http_x_correlation_id $correlacion {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    # Tienda: dominio principal.
    server {
        listen 8080 default_server;

        limit_req zone=por_ip burst=40 nodelay;
        limit_conn conexiones_por_ip 30;

        proxy_set_header Host $host;
        # Origen del cliente final (SEG-17, SEG-23): ninguna cabecera de reenvío del cliente llega a la aplicación; la única que se fija
        # es X-Origen-Cliente y vale solo si la conexión viene del túnel de confianza y CF-Connecting-IP es UNA dirección.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Origen-Cliente $origen_del_cliente;
        # País del cliente según Cloudflare: Nginx SIEMPRE sobrescribe esta cabecera, de modo que una región enviada por el cliente nunca llega a la aplicación (WEB-37, WEB-39).
        proxy_set_header X-Region-Del-Borde $region_del_borde;
        proxy_set_header X-Origen-Reenviado "";
        proxy_set_header X-Credencial-De-Origen "";
        proxy_set_header X-Credencial-De-Servicio "";
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Correlation-Id $correlacion;

        location = /health { return 200 "ok\n"; add_header Content-Type text/plain; }

        # Las integraciones internas (los estados de entrega de n8n y las solicitudes de aviso del Inventario) no existen en el borde público: llegan directo al servicio por la red privada (T19).
        # Insensible a mayúsculas: el enrutado de la aplicación también lo es y no debe haber una variante que esquive el 404.
        location ~* ^/api/ecommerce/v1/integraciones/(n8n|inventario)(/|$) { return 404; }

        location / { proxy_pass http://ecommerce; }
    }

    # Gestión: subdominio del personal (cookies propias; protegido por Cloudflare Access).
    server {
        listen 8080;
        server_name gestion.*;

        limit_req zone=por_ip burst=20 nodelay;
        limit_conn conexiones_por_ip 20;

        proxy_set_header Host $host;
        # Origen del cliente final (SEG-17, SEG-23): ninguna cabecera de reenvío del cliente llega a la aplicación; la única que se fija
        # es X-Origen-Cliente y vale solo si la conexión viene del túnel de confianza y CF-Connecting-IP es UNA dirección.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Origen-Cliente $origen_del_cliente;
        # País del cliente según Cloudflare: Nginx SIEMPRE sobrescribe esta cabecera, de modo que una región enviada por el cliente nunca llega a la aplicación (WEB-37, WEB-39).
        proxy_set_header X-Region-Del-Borde $region_del_borde;
        proxy_set_header X-Origen-Reenviado "";
        proxy_set_header X-Credencial-De-Origen "";
        proxy_set_header X-Credencial-De-Servicio "";
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Correlation-Id $correlacion;

        # Insensible a mayúsculas: el enrutado de la aplicación también lo es y no debe haber una variante que esquive el 404.
        location ~* ^/api/ecommerce/v1/integraciones/(n8n|inventario)(/|$) { return 404; }

        location / { proxy_pass http://gestion; }
    }
}
