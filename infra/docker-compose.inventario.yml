# VM-INVENTARIO (ARM, 1 OCPU y 6 GB): Inventario, réplica de gestión del E-commerce y PostgreSQL (AD11, AD31).
# Se levanta con un solo comando y sus secretos (PLA-04):
#   BABELHUB_SECRETOS=/etc/babelhub/secretos IP_PRIVADA=10.0.1.10 \
#   IMAGEN_INVENTARIO=<imagen@sha256:…> IMAGEN_ECOMMERCE=<imagen@sha256:…> IMAGEN_POSTGRES=<imagen@sha256:…> \
#   docker compose -f infra/docker-compose.inventario.yml up -d
# Reglas de PLA-26 y PLA-27 (las verifica una inspección automática de este archivo):
#   - Las imágenes propias llegan por IMAGEN_<NOMBRE>, con el digest de la imagen publicada por el flujo de lanzamiento; desplegar.sh (T23)
#     rechaza un valor sin `@sha256:`. Las de terceros van aquí con etiqueta y digest.
#   - Cada contenedor: usuario sin privilegios, sin modo privilegiado, sin el socket del motor, sin capacidades (todas descartadas, y no se
#     pueden ganar otras), límite de memoria y de procesador, comprobación de salud y sistema de archivos de solo lectura (con tmpfs donde
#     hace falta escribir). Lo que un contenedor no pueda cumplir consta en `x-excepciones` con su motivo y su mitigación.
#   - Los puertos solo se publican en la dirección privada de la VM, nunca en 0.0.0.0. La base no tiene acceso desde Internet.
#   - Los secretos viven fuera del repositorio, en BABELHUB_SECRETOS, y cada VM solo recibe los suyos.
name: babelhub-inventario

x-excepciones: []

x-registro: &registro
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # Una instancia con las bases ecommerce e inventario y la técnica evolution (AD03); la imagen derivada trae age y rclone (D06).
    image: ${IMAGEN_POSTGRES:?Define IMAGEN_POSTGRES con el digest de la imagen publicada de infra/postgres}
    user: postgres
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - "${BABELHUB_SECRETOS:?Define BABELHUB_SECRETOS con la carpeta de los secretos de esta VM}/postgres.env"
    # Archivado continuo de WAL cifrado hacia el almacén (PLA-15, D10): archive_timeout=300 y el latido de la base garantizan segmentos nuevos
    # aunque no haya actividad. archivar-wal.sh y respaldar.sh vienen en la imagen (infra/postgres/respaldos); las variables de age y del
    # almacén (credencial respaldos-escritor, que solo crea) llegan en postgres.env. /config es la configuración de la VM, sin secretos.
    # TLS (AM24): el entrypoint de la imagen copia el certificado y la clave (secretos) a memoria con los permisos que exige PostgreSQL y arranca el servidor; `pg_hba.conf` (en la imagen) solo admite `hostssl`
    # y rechaza lo demás, así que una conexión sin cifrar o de un cliente que no confía en la CA privada nunca llega a pedir la contraseña. TLS 1.3 como mínimo.
    entrypoint: ["/opt/babelhub/iniciar.sh"]
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/run/postgresql/tls/server.crt", "-c", "ssl_key_file=/run/postgresql/tls/server.key", "-c", "ssl_min_protocol_version=TLSv1.3", "-c", "hba_file=/opt/babelhub/pg_hba.conf", "-c", "shared_buffers=768MB", "-c", "max_connections=100", "-c", "archive_timeout=300", "-c", "archive_mode=on", "-c", "archive_command=/opt/babelhub/archivar-wal.sh %p %f"]
    ports:
      - "${IP_PRIVADA:?Define IP_PRIVADA con la dirección privada de esta VM}:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - respaldo-espera:/var/respaldos
      - ./:/config:ro
    secrets:
      - source: tls-postgres-cert.pem
        target: tls-cert.pem
      - source: tls-postgres-key.pem
        target: tls-key.pem
    mem_limit: 2g
    cpus: 0.4
    pids_limit: 300
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 60s
    logging: *registro
    restart: unless-stopped

  inventario:
    image: ${IMAGEN_INVENTARIO:?Define IMAGEN_INVENTARIO con el digest de la imagen publicada}
    user: "1654:1654"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # DD-51: memoria de 5 s de la lista de fuentes y del formato de las ediciones, solo para la consulta pública de disponibilidad (nunca stock ni reservas).
      BABELHUB__Inventario__ReferenciasEnMemoriaSegundos: "5"
      # DD-55: en Production la superficie entre servicios exige HTTPS (guardas de arranque y docs/05): Kestrel escucha también en 8443 con el certificado de la red privada de esta VM, y la raíz de
      # confianza del proceso es la de la VM más la CA privada (ca-bundle.pem, que arma desplegar.sh). La comprobación de salud sigue por el 8080, sin credencial.
      ASPNETCORE_HTTPS_PORTS: "8443"
      Kestrel__Certificates__Default__Path: /run/secrets/tls-cert.pem
      Kestrel__Certificates__Default__KeyPath: /run/secrets/tls-key.pem
      SSL_CERT_FILE: /run/secrets/ca-bundle.pem
    env_file:
      - "${BABELHUB_SECRETOS:?}/inventario.env"
    ports:
      - "${IP_PRIVADA:?}:8082:8443"
    secrets:
      - source: tls-inventario-cert.pem
        target: tls-cert.pem
      - source: tls-inventario-key.pem
        target: tls-key.pem
      - ca-bundle.pem
    mem_limit: 512m
    cpus: 0.6
    pids_limit: 200
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    logging: *registro
    restart: unless-stopped

  ecommerce-gestion:
    # La réplica de gestión (AD31): la misma imagen del E-commerce con el perfil «solo gestión» (áreas Sucursal y Admin).
    image: ${IMAGEN_ECOMMERCE:?Define IMAGEN_ECOMMERCE con el digest de la imagen publicada}
    user: "1654:1654"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      # PAG-34: ASPNETCORE_ENVIRONMENT NO se fija aquí: lo define ecommerce-gestion.env, igual que en ecommerce.env de VM-VENTAS (los dos procesos del E-commerce corren en el mismo entorno). Ver docker-compose.ventas.yml.
      BABELHUB__Perfil: Gestion
      # El rol del proceso (web-base, D03); BABELHUB__Web__HostsPermitidos va en ecommerce-gestion.env: sin él el servicio no arranca.
      BABELHUB__Web__Host: gestion
      # DD-55: el mismo HTTPS y la misma raíz de confianza que el Inventario (el Inventario le pide las claves de verificación por https://ecommerce-gestion:8443).
      ASPNETCORE_HTTPS_PORTS: "8443"
      Kestrel__Certificates__Default__Path: /run/secrets/tls-cert.pem
      Kestrel__Certificates__Default__KeyPath: /run/secrets/tls-key.pem
      SSL_CERT_FILE: /run/secrets/ca-bundle.pem
    env_file:
      - "${BABELHUB_SECRETOS:?}/ecommerce-gestion.env"
    ports:
      - "${IP_PRIVADA:?}:8081:8080"
    secrets:
      - source: tls-gestion-cert.pem
        target: tls-cert.pem
      - source: tls-gestion-key.pem
        target: tls-key.pem
      - ca-bundle.pem
    mem_limit: 450m
    cpus: 0.4
    pids_limit: 200
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    logging: *registro
    restart: unless-stopped

secrets:
  tls-postgres-cert.pem:
    file: ${BABELHUB_SECRETOS:?}/tls-postgres-cert.pem
  tls-postgres-key.pem:
    file: ${BABELHUB_SECRETOS:?}/tls-postgres-key.pem
  tls-inventario-cert.pem:
    file: ${BABELHUB_SECRETOS:?}/tls-inventario-cert.pem
  tls-inventario-key.pem:
    file: ${BABELHUB_SECRETOS:?}/tls-inventario-key.pem
  tls-gestion-cert.pem:
    file: ${BABELHUB_SECRETOS:?}/tls-gestion-cert.pem
  tls-gestion-key.pem:
    file: ${BABELHUB_SECRETOS:?}/tls-gestion-key.pem
  ca-bundle.pem:
    file: ${BABELHUB_SECRETOS:?}/ca-bundle.pem

volumes:
  postgres-data:
  # Lo cifrado que espera su subida (4 GB reservados, D11; la vigilancia del espacio es de T26).
  respaldo-espera:
