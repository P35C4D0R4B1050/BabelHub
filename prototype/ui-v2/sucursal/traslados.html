<!doctype html>
<html lang="es-PE" data-theme="babelhub">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traslados · BabelHub</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="../assets/theme.css">
<script src="../assets/data.js"></script>
<script src="../assets/data-paneles.js"></script>
<script src="../assets/app.js"></script>
<script src="../assets/panel.js"></script>
</head>
<body data-area="sucursal" data-page="traslados" data-roles="encargado,admin" data-estados="normal,vacio,error">
<div id="page-content" hidden>
  <div class="flex flex-wrap items-end justify-between gap-3">
    <div><h1 class="bh-display" style="font-size:clamp(1.8rem,5vw,3rem)">Traslados</h1>
      <p class="opacity-75 mt-1 max-w-2xl">Entrantes (hacia Ayacucho) y salientes (desde Ayacucho). Cada paso queda en la auditoría y avisa a origen y destino.</p></div>
    <button class="btn btn-primary" id="nueva"></button>
  </div>
  <div role="tablist" class="tabs tabs-border mt-4" id="tabs"></div>
  <div id="lista" class="mt-3"></div>

  <dialog id="dlg" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box">
      <h2 class="font-display text-2xl mb-3">Pedir mercadería a otra sucursal</h2>
      <div class="space-y-3">
        <label class="floating-label w-full"><span>Libro (impreso)</span><select id="n-libro" class="select w-full"></select></label>
        <label class="floating-label w-full"><span>Sucursal de origen</span><select id="n-origen" class="select w-full"></select></label>
        <label class="floating-label w-full"><span id="n-cant-t">Cantidad</span><input id="n-cant" class="input w-full" type="number" min="1" step="1" inputmode="numeric" value="1"></label>
        <label class="floating-label w-full"><span>Motivo</span><input id="n-motivo" class="input w-full" value="Reposición de stock"></label>
        <p id="n-aviso" class="text-sm" role="status"></p>
      </div>
      <div class="modal-action"><form method="dialog"><button class="btn btn-ghost">Cancelar</button></form><button class="btn btn-primary" id="n-ok">Solicitar traslado</button></div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>cerrar</button></form>
  </dialog>
</div>

<script>
BH.ready(() => {
  if (BH.bloqueado) return;
  const $ = (id) => document.getElementById(id);
  const actor = BH.actor(), ME = BH.MI_SUC;
  $('nueva').innerHTML = BH.icon('plus', 'size-5') + ' Nueva solicitud';
  let filtro = 'todos';
  const TABS = [['todos', 'Todos'], ['solicitado', 'Solicitados'], ['aprobado', 'Aprobados'], ['transito', 'En tránsito'], ['recibido', 'Recibidos'], ['rechazado', 'Rechazados']];
  const nom = (id) => BH.sucursal(id).nombre;

  function pintar() {
    const lista = BH.estado === 'vacio' ? [] : BH.tras.get().filter((t) => t.origen === ME || t.destino === ME || actor === 'admin');
    $('tabs').innerHTML = TABS.map(([k, l]) => `<button role="tab" aria-selected="${filtro === k}" class="tab ${filtro === k ? 'tab-active' : ''}" data-f="${k}">${l} <span class="badge badge-sm ml-1">${k === 'todos' ? lista.length : lista.filter((t) => t.estado === k).length}</span></button>`).join('');
    $('tabs').querySelectorAll('[data-f]').forEach((b) => (b.onclick = () => { filtro = b.dataset.f; pintar(); }));
    if (BH.estado === 'error') { $('lista').innerHTML = BH.errorState('No pudimos cargar los traslados.'); return; }
    const l = lista.filter((t) => filtro === 'todos' || t.estado === filtro);
    if (!l.length) { $('lista').innerHTML = BH.emptyState('swap', 'No hay traslados', 'Cuando una sucursal pida o envíe mercadería, aparecerá aquí.'); return; }
    $('lista').innerHTML = `<div class="overflow-x-auto border border-[var(--bh-linea)] bg-base-100"><table class="table"><thead><tr><th>N.°</th><th>Libro</th><th class="text-right">Cant.</th><th>Ruta</th><th>Estado</th><th></th></tr></thead><tbody>
      ${l.map((t) => { const acc = BH.trasladoAcciones(t, actor), dir = t.origen === ME ? 'Saliente' : t.destino === ME ? 'Entrante' : 'Otras sucursales';
        return `<tr><td class="font-mono text-sm">${t.id}<div class="text-xs opacity-50">${t.fecha}</div></td><td><div class="font-medium">${BH.obra(t.obra).titulo}</div><div class="text-xs opacity-60">${t.motivo}</div></td><td class="text-right tabular-nums">${t.cant}</td>
        <td class="whitespace-nowrap">${nom(t.origen)} → ${nom(t.destino)}<div class="text-xs opacity-60">${dir}</div></td><td>${BH.chipEstado(t.estado)}</td>
        <td class="text-right whitespace-nowrap">${acc.length ? acc.map(([a, lab]) => `<button class="btn btn-sm ${a === 'rechazado' ? 'btn-ghost' : 'btn-primary'}" data-id="${t.id}" data-a="${a}">${lab}</button>`).join(' ') : '<span class="text-xs opacity-40">—</span>'}</td></tr>`; }).join('')}</tbody></table></div>`;
    $('lista').querySelectorAll('[data-id]').forEach((b) => (b.onclick = () => {
      const all = BH.tras.get(), t = all.find((x) => x.id === b.dataset.id);
      const r = BH.aplicarTraslado(t, b.dataset.a);
      if (!r.ok) { BH.toast(r.msg, 'error'); return; }
      BH.tras.set(all); BH.toast(r.msg); pintar();
    }));
  }

  /* Nueva solicitud: solo se ofrecen orígenes con stock vendible (TRA-02) y la cantidad nunca supera lo vendible del origen */
  const libros = BH.obras.filter((o) => o.impreso);
  const hayOrigen = (o) => BH.sucursales.some((s) => s.id !== ME && BH.vendible(o, s.id) > 0);
  $('n-libro').innerHTML = libros.map((o) => `<option value="${o.id}" ${hayOrigen(o) ? '' : 'disabled'}>${o.titulo}${hayOrigen(o) ? '' : ' (agotado en la red)'}</option>`).join('');
  const maxOrigen = () => { const o = BH.obra($('n-libro').value), org = $('n-origen').value; return org ? BH.vendible(o, org) : 0; };
  function cantidad(tocada) {
    const max = maxOrigen(), inp = $('n-cant'), org = $('n-origen').value, ok = $('n-ok'), av = $('n-aviso');
    inp.max = max; $('n-cant-t').textContent = max ? `Cantidad (máximo ${max})` : 'Cantidad';
    if (!max) { inp.value = ''; inp.disabled = true; ok.disabled = true; return; }
    inp.disabled = false;
    if (inp.value.trim() === '') { ok.disabled = true; av.innerHTML = `${BH.icon('warn', 'size-4 inline text-warning')} Escribe cuántas unidades pides.`; return; }
    let c = parseInt(inp.value, 10), ajustada = false;
    if (!Number.isInteger(c) || c < 1) { c = 1; ajustada = true; }
    if (c > max) { c = max; ajustada = true; }
    inp.value = c; ok.disabled = false;
    av.innerHTML = ajustada ? `${BH.icon('warn', 'size-4 inline text-warning')} Ajustamos a ${c}: ${nom(org)} solo tiene ${max} vendible${max === 1 ? '' : 's'}.` : `${BH.icon('check', 'size-4 inline text-success')} Puedes pedir hasta ${max}: es lo que ${nom(org)} tiene vendible.`;
  }
  function origenes() {
    const o = BH.obra($('n-libro').value);
    const ops = BH.sucursales.filter((s) => s.id !== ME && BH.vendible(o, s.id) > 0);
    $('n-origen').innerHTML = ops.length ? ops.map((s) => `<option value="${s.id}">${s.nombre} (vendible ${BH.vendible(o, s.id)})</option>`).join('') : '<option value="">Ninguna sucursal tiene stock vendible</option>';
    if (!ops.length) $('n-aviso').innerHTML = `${BH.icon('warn', 'size-4 inline text-error')} Este libro está agotado en toda la red.`;
    cantidad(false);
  }
  $('n-libro').onchange = () => { $('n-cant').value = 1; origenes(); };
  $('n-origen').onchange = () => cantidad(false);
  $('n-cant').oninput = () => cantidad(true);
  $('nueva').onclick = () => { const p = libros.find(hayOrigen); if (p) $('n-libro').value = p.id; $('n-cant').value = 1; origenes(); $('dlg').showModal(); };
  $('n-ok').onclick = () => {
    const o = BH.obra($('n-libro').value), org = $('n-origen').value, c = parseInt($('n-cant').value, 10);
    if (!org) { BH.toast('No hay origen con stock vendible', 'error'); return; }
    if (!(c > 0) || c > BH.vendible(o, org)) { cantidad(true); return; }
    const all = BH.tras.get(), id = 'TR-' + String(48 + all.length - 7).padStart(4, '0');
    all.unshift({ id, obra: o.id, cant: c, origen: org, destino: ME, estado: 'solicitado', fecha: BH.hoy, motivo: $('n-motivo').value || 'Solicitud' });
    BH.tras.set(all); BH.audit.add('Solicitud de traslado', `${id} ${nom(org)} → ${nom(ME)} · ${c} × ${o.titulo}`);
    $('dlg').close(); BH.toast(`${id} solicitado. Se avisó a ${nom(org)} por WhatsApp.`); filtro = 'todos'; pintar();
  };
  pintar();
});
</script>
</body>
</html>
