<!doctype html>
<html lang="es-PE" data-theme="babelhub">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Libro · BabelHub</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="../assets/theme.css">
<script src="../assets/data.js"></script>
<script src="../assets/app.js"></script>
</head>
<body data-area="tienda" data-page="libro" data-estados="normal,error">
<div id="page-content" hidden>
  <div class="breadcrumbs text-sm mb-4"><ul><li><a href="index.html">Catálogo</a></li><li id="bc-cat"></li><li id="bc-tit"></li></ul></div>
  <div id="detalle"></div>
</div>

<script>
BH.ready(() => {
  const $ = (id) => document.getElementById(id);
  if (BH.estado === 'error') { $('detalle').innerHTML = BH.errorState('No pudimos cargar este libro.'); return; }
  const b = BH.libro(BH.param('id') || 1) || BH.libros[0];
  const mine = BH.miSucursal();
  $('bc-cat').textContent = b.categoria; $('bc-tit').textContent = b.titulo;
  document.title = b.titulo + ' · BabelHub';
  const total = BH.totalVendible(b), enMia = BH.vendible(b, mine);

  const filas = BH.sucursales.map((s) => {
    const v = BH.vendible(b, s.id), f = b.stock[s.id][0];
    const est = v === 0 ? '<span class="badge badge-error badge-soft badge-sm">Sin stock</span>' : v <= 2 ? '<span class="badge badge-warning badge-soft badge-sm">Pocas</span>' : '<span class="badge badge-success badge-soft badge-sm">Disponible</span>';
    return `<tr class="${s.id === mine ? 'bg-base-200 font-medium' : ''}"><td>${s.nombre}${s.id === mine ? ' <span class="badge badge-primary badge-xs">Tu sucursal</span>' : ''}</td><td class="text-right">${v}</td><td>${est}</td></tr>`;
  }).join('');

  let aviso = '';
  if (total === 0) aviso = `<div role="alert" class="alert alert-error alert-soft">${BH.icon('warn')}<span>Agotado en todas las sucursales. Estamos esperando reposición.</span></div>`;
  else if (enMia === 0) aviso = `<div role="alert" class="alert alert-info alert-soft">${BH.icon('truck')}<span>Tu sucursal (${BH.sucursal(mine).nombre}) no tiene este libro. Lo traeremos desde ${BH.conStock(b)[0].nombre} con un traslado: <b>≈ 2 días hábiles</b>.</span></div>`;

  $('detalle').innerHTML = `
  <div class="grid md:grid-cols-[18rem_1fr] gap-8">
    <div class="max-w-xs mx-auto md:mx-0 w-full">${BH.cover(b)}</div>
    <div class="space-y-5">
      <div>
        <p class="text-sm uppercase tracking-wide text-secondary font-semibold">${b.categoria}</p>
        <h1 class="font-display text-3xl sm:text-4xl leading-tight">${b.titulo}</h1>
        <p class="text-lg text-base-content/70">${b.autor}</p>
      </div>
      <p class="max-w-2xl">${b.desc}</p>
      <dl class="grid grid-cols-2 gap-x-6 gap-y-1 text-sm max-w-md">
        <dt class="text-base-content/60">Editorial</dt><dd>${b.editorial}</dd>
        <dt class="text-base-content/60">ISBN</dt><dd>${b.isbn}</dd>
        <dt class="text-base-content/60">Stock vendible en la red</dt><dd class="font-semibold">${total} ud.</dd>
      </dl>
      ${aviso}
      <div class="flex flex-wrap items-center gap-4">
        <span class="text-3xl font-semibold text-primary">${BH.money(b.precio)}</span>
        <div class="join" ${total === 0 ? 'hidden' : ''}>
          <button class="btn join-item" id="q-menos" aria-label="Menos">−</button>
          <input id="qty" class="input join-item w-16 text-center" value="1" inputmode="numeric" aria-label="Cantidad">
          <button class="btn join-item" id="q-mas" aria-label="Más">+</button>
        </div>
        <button id="add" class="btn btn-primary" ${total === 0 ? 'disabled' : ''}>${BH.icon('cart', 'size-5')} Agregar al carrito</button>
      </div>
      <div class="card bg-base-100 border border-base-300">
        <div class="card-body p-4">
          <h2 class="font-semibold flex items-center gap-2">${BH.icon('store', 'size-5')} Disponibilidad por sucursal</h2>
          <div class="overflow-x-auto"><table class="table table-sm">
            <thead><tr><th>Sucursal</th><th class="text-right">Vendible</th><th>Estado</th></tr></thead><tbody>${filas}</tbody></table></div>
          <p class="text-xs text-base-content/60">Vendible = stock físico − unidades reservadas por pedidos en curso.</p>
        </div>
      </div>
    </div>
  </div>`;

  const qty = $('qty');
  $('q-mas').onclick = () => (qty.value = Math.min(total, Number(qty.value) + 1));
  $('q-menos').onclick = () => (qty.value = Math.max(1, Number(qty.value) - 1));
  $('add').onclick = () => {
    const n = Math.max(1, Math.min(total, parseInt(qty.value, 10) || 1));
    BH.cart.add(b.id, n); BH.toast(`${n} × ${b.titulo} agregado al carrito`);
  };
});
</script>
</body>
</html>
