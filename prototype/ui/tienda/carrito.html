<!doctype html>
<html lang="es-PE" data-theme="babelhub">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carrito · BabelHub</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="../assets/theme.css">
<script src="../assets/data.js"></script>
<script src="../assets/app.js"></script>
</head>
<body data-area="tienda" data-page="carrito" data-estados="normal,vacio">
<div id="page-content" hidden>
  <h1 class="font-display text-3xl mb-1">Tu carrito</h1>
  <p class="text-sm text-base-content/70 mb-6">Se conserva en tu cuenta, así que lo ves igual desde tu celular o tu computadora.</p>
  <div id="cart"></div>
</div>

<script>
BH.ready(() => {
  const root = document.getElementById('cart');
  const mine = BH.miSucursal();

  function pintar() {
    const c = BH.estado === 'vacio' ? {} : BH.cart.get();
    const ids = Object.keys(c);
    if (!ids.length) {
      root.innerHTML = BH.emptyState('cart', 'Tu carrito está vacío', 'Agrega libros desde el catálogo para comenzar tu compra.',
        '<a class="btn btn-primary btn-sm" href="index.html">Explorar el catálogo</a><button class="btn btn-ghost btn-sm" id="demo">Cargar un carrito de ejemplo</button>');
      document.getElementById('demo').onclick = () => { BH.cart.set({ 1: 1, 5: 1 }); location.search = ''; };
      return;
    }
    let sub = 0, problema = false;
    const filas = ids.map((id) => {
      const b = BH.libro(id), q = c[id], tot = BH.totalVendible(b);
      sub += b.precio * q;
      const tope = q > tot;
      if (tope) problema = true;
      const nota = tope
        ? `<span class="text-error text-xs">Solo quedan ${tot} en la red. Ajusta la cantidad.</span>`
        : BH.vendible(b, mine) >= q ? '<span class="text-success text-xs">Disponible en tu sucursal</span>'
        : '<span class="text-info text-xs">Se traerá de otra sucursal (≈ 2 días)</span>';
      return `<div class="flex gap-4 py-4 border-b border-base-300">
        <a href="libro.html?id=${b.id}" class="w-16 shrink-0">${BH.cover(b, 'w-full aspect-[2/3] !p-1.5')}</a>
        <div class="flex-1 min-w-0">
          <a href="libro.html?id=${b.id}" class="font-display text-lg leading-tight hover:underline">${b.titulo}</a>
          <p class="text-sm text-base-content/70">${b.autor}</p>${nota}
          <div class="flex items-center gap-3 mt-2">
            <div class="join"><button class="btn btn-sm join-item" data-menos="${id}" aria-label="Menos">−</button>
              <span class="join-item btn btn-sm btn-ghost pointer-events-none w-10">${q}</span>
              <button class="btn btn-sm join-item" data-mas="${id}" aria-label="Más">+</button></div>
            <button class="btn btn-ghost btn-sm text-error" data-quitar="${id}">${BH.icon('trash', 'size-4')} Quitar</button>
          </div></div>
        <p class="font-semibold">${BH.money(b.precio * q)}</p></div>`;
    }).join('');
    root.innerHTML = `<div class="grid lg:grid-cols-[1fr_22rem] gap-8 items-start">
      <section>${filas}</section>
      <aside class="card bg-base-100 border border-base-300 lg:sticky lg:top-28"><div class="card-body gap-3">
        <h2 class="font-semibold text-lg">Resumen</h2>
        <div class="flex justify-between"><span>Subtotal</span><span>${BH.money(sub)}</span></div>
        <div class="flex justify-between text-sm text-base-content/70"><span>Envío</span><span>Se calcula en el checkout</span></div>
        <div class="divider my-0"></div>
        <div class="flex justify-between text-lg font-semibold"><span>Total</span><span class="text-primary">${BH.money(sub)}</span></div>
        <div role="alert" class="alert alert-soft text-xs">${BH.icon('clock', 'size-4')}<span>Reservamos tu stock durante 15 minutos cuando inicias el pago.</span></div>
        <a href="checkout.html" class="btn btn-primary ${problema ? 'btn-disabled' : ''}" ${problema ? 'aria-disabled="true"' : ''}>Continuar con la compra</a>
        <a href="index.html" class="btn btn-ghost btn-sm">Seguir comprando</a>
      </div></aside></div>`;
    root.querySelectorAll('[data-mas]').forEach((b) => (b.onclick = () => { BH.cart.setQty(b.dataset.mas, c[b.dataset.mas] + 1); pintar(); }));
    root.querySelectorAll('[data-menos]').forEach((b) => (b.onclick = () => { BH.cart.setQty(b.dataset.menos, c[b.dataset.menos] - 1); pintar(); }));
    root.querySelectorAll('[data-quitar]').forEach((b) => (b.onclick = () => { BH.cart.setQty(b.dataset.quitar, 0); pintar(); }));
  }
  pintar();
});
</script>
</body>
</html>
