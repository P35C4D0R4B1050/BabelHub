<!doctype html>
<html lang="es-PE" data-theme="babelhub">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo (admin) · BabelHub</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="../assets/theme.css">
<script src="../assets/data.js"></script>
<script src="../assets/app.js"></script>
</head>
<body data-area="admin" data-page="catalogo" data-estados="normal,vacio,error">
<div id="page-content" hidden>
  <div class="flex flex-wrap items-end justify-between gap-3 mb-4">
    <div><h1 class="font-display text-3xl">Catálogo nacional</h1><p class="text-sm text-base-content/70">Un solo catálogo para toda la red. El ISBN es único.</p></div>
    <button class="btn btn-primary" id="nuevo"></button>
  </div>
  <div id="tabla"></div>

  <dialog id="dlg" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box max-w-xl">
      <h3 class="font-display text-xl mb-3" id="dlg-t">Nuevo libro</h3>
      <div class="grid sm:grid-cols-2 gap-3">
        <label class="floating-label sm:col-span-2"><span>Título</span><input id="f-tit" class="input w-full" placeholder="Título"></label>
        <label class="floating-label"><span>Autor</span><input id="f-aut" class="input w-full" placeholder="Autor"></label>
        <label class="floating-label"><span>Editorial</span><input id="f-edi" class="input w-full" placeholder="Editorial"></label>
        <div><label class="floating-label"><span>ISBN</span><input id="f-isbn" class="input w-full" placeholder="ISBN"></label><p id="e-isbn" class="text-error text-xs mt-1" role="alert"></p></div>
        <label class="floating-label"><span>Categoría</span><select id="f-cat" class="select w-full"></select></label>
        <label class="floating-label"><span>Precio (S/)</span><input id="f-pre" class="input w-full" inputmode="decimal" placeholder="Precio"></label>
        <label class="floating-label"><span>Imagen de portada</span><input type="file" class="file-input w-full" accept="image/*"></label>
      </div>
      <p id="e-gen" class="text-error text-sm mt-2" role="alert"></p>
      <div class="modal-action"><form method="dialog"><button class="btn btn-ghost">Cancelar</button></form><button class="btn btn-primary" id="guardar">Guardar</button></div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>cerrar</button></form>
  </dialog>
</div>

<script>
BH.ready(() => {
  const $ = (id) => document.getElementById(id);
  $('nuevo').innerHTML = BH.icon('plus', 'size-5') + ' Nuevo libro';
  $('f-cat').innerHTML = BH.categorias.map((c) => `<option>${c}</option>`).join('');
  const libros = BH.libros;
  let editando = null;

  function tabla() {
    if (BH.estado === 'error') { $('tabla').innerHTML = BH.errorState('No pudimos cargar el catálogo.'); return; }
    if (BH.estado === 'vacio') { $('tabla').innerHTML = BH.emptyState('book', 'Aún no hay títulos', 'Publica el primer libro del catálogo nacional.'); return; }
    $('tabla').innerHTML = `<div class="overflow-x-auto card bg-base-100 border border-base-300"><table class="table">
      <thead><tr><th>Título</th><th>Categoría</th><th>ISBN</th><th class="text-right">Precio</th><th class="text-right">Stock red</th><th></th></tr></thead>
      <tbody>${libros.map((b) => `<tr><td><div class="font-medium">${b.titulo}</div><div class="text-xs text-base-content/60">${b.autor} · ${b.editorial}</div></td>
        <td><span class="badge badge-ghost">${b.categoria}</span></td><td class="font-mono text-xs">${b.isbn}</td>
        <td class="text-right tabular-nums">${BH.money(b.precio)}</td><td class="text-right tabular-nums">${BH.totalVendible(b)}</td>
        <td class="text-right whitespace-nowrap"><button class="btn btn-sm btn-ghost" data-ed="${b.id}">Editar</button> <button class="btn btn-sm btn-ghost text-error" data-baja="${b.id}">Dar de baja</button></td></tr>`).join('')}</tbody></table></div>`;
    $('tabla').querySelectorAll('[data-ed]').forEach((x) => (x.onclick = () => abrir(BH.libro(x.dataset.ed))));
    $('tabla').querySelectorAll('[data-baja]').forEach((x) => (x.onclick = () => {
      const i = libros.findIndex((b) => b.id === Number(x.dataset.baja)); const b = libros[i];
      libros.splice(i, 1); BH.audit.add('admin.central', 'Administrador central', 'Baja de título', b.titulo); BH.toast('Título dado de baja'); tabla();
    }));
  }

  function abrir(b) {
    editando = b || null; $('dlg-t').textContent = b ? 'Editar libro' : 'Nuevo libro';
    $('f-tit').value = b ? b.titulo : ''; $('f-aut').value = b ? b.autor : ''; $('f-edi').value = b ? b.editorial : '';
    $('f-isbn').value = b ? b.isbn : ''; $('f-cat').value = b ? b.categoria : BH.categorias[0]; $('f-pre').value = b ? b.precio : '';
    $('e-isbn').textContent = ''; $('e-gen').textContent = ''; $('dlg').showModal();
  }
  $('nuevo').onclick = () => abrir(null);
  $('f-isbn').addEventListener('input', () => {
    const dup = libros.find((b) => b.isbn === $('f-isbn').value.trim() && b !== editando);
    $('e-isbn').textContent = dup ? `Ya existe: “${dup.titulo}”. El ISBN debe ser único.` : '';
  });
  $('guardar').onclick = () => {
    const v = { titulo: $('f-tit').value.trim(), autor: $('f-aut').value.trim(), editorial: $('f-edi').value.trim(), isbn: $('f-isbn').value.trim(), categoria: $('f-cat').value, precio: parseFloat($('f-pre').value) };
    if (!v.titulo || !v.autor || !v.editorial || !v.isbn || !(v.precio > 0)) { $('e-gen').textContent = 'Completa título, autor, editorial, ISBN y un precio mayor que cero.'; return; }
    if ($('e-isbn').textContent) return;
    if (editando) {
      if (editando.precio !== v.precio) BH.audit.add('admin.central', 'Administrador central', 'Cambio de precio', `${editando.titulo}: ${BH.money(editando.precio)} → ${BH.money(v.precio)}`);
      Object.assign(editando, v);
    } else {
      libros.unshift({ id: Date.now(), hue: Math.floor(Math.random() * 360), desc: '', stock: Object.fromEntries(BH.sucursales.map((s) => [s.id, [0, 0]])), ...v });
      BH.audit.add('admin.central', 'Administrador central', 'Alta de título', v.titulo);
    }
    $('dlg').close(); BH.toast('Libro guardado'); tabla();
  };
  tabla();
});
</script>
</body>
</html>
