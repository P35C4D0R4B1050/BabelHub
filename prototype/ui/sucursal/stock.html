<!doctype html>
<html lang="es-PE" data-theme="babelhub">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventario de sucursal · BabelHub</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="../assets/theme.css">
<script src="../assets/data.js"></script>
<script src="../assets/app.js"></script>
</head>
<body data-area="sucursal" data-page="stock" data-estados="normal,cargando,vacio,error">
<div id="page-content" hidden>
  <div class="flex flex-wrap items-end justify-between gap-3 mb-4">
    <div><h1 class="font-display text-3xl">Inventario · Ayacucho</h1>
      <p class="text-sm text-base-content/70">Solo ves y modificas el stock de tu sucursal.</p></div>
    <label class="input w-full sm:w-72"><span class="opacity-60" id="ic-search"></span><input id="buscar" type="search" placeholder="Buscar título o ISBN" aria-label="Buscar en el inventario"></label>
  </div>
  <div class="stats stats-vertical sm:stats-horizontal bg-base-100 border border-base-300 w-full mb-4" id="kpis"></div>
  <div id="tabla"></div>

  <dialog id="dlg-aj" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box">
      <h3 class="font-display text-xl" id="aj-titulo">Ajustar inventario</h3>
      <p class="text-sm text-base-content/70 mb-3" id="aj-info"></p>
      <div class="space-y-3">
        <label class="floating-label w-full"><span>Motivo</span>
          <select id="aj-motivo" class="select w-full"><option>Merma</option><option>Producto dañado</option><option>Corrección de conteo</option></select></label>
        <label class="floating-label w-full"><span>Cantidad a sumar o restar (ej. -2)</span>
          <input id="aj-delta" class="input w-full" inputmode="numeric" value="-1"></label>
        <p id="aj-prev" class="text-sm" role="status"></p>
      </div>
      <div class="modal-action"><form method="dialog" class="flex gap-2"><button class="btn btn-ghost">Cancelar</button></form><button class="btn btn-primary" id="aj-ok">Registrar ajuste</button></div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>cerrar</button></form>
  </dialog>
</div>

<script>
BH.ready(() => {
  const $ = (id) => document.getElementById(id);
  $('ic-search').innerHTML = BH.icon('search', 'size-4');
  const SID = 'aya'; let actual = null;
  const datos = BH.libros.map((b) => ({ b, f: b.stock[SID][0], r: b.stock[SID][1] }));

  function kpis() {
    const f = datos.reduce((a, d) => a + d.f, 0), r = datos.reduce((a, d) => a + d.r, 0);
    $('kpis').innerHTML = [['Stock físico', f, ''], ['Reservado', r, 'text-warning'], ['Vendible', f - r, 'text-success']]
      .map(([t, v, c]) => `<div class="stat py-3"><div class="stat-title">${t}</div><div class="stat-value text-3xl ${c}">${v}</div></div>`).join('');
  }

  function tabla() {
    if (BH.estado === 'cargando') { $('tabla').innerHTML = '<div class="space-y-2">' + Array.from({ length: 6 }, () => '<div class="skeleton h-12 w-full"></div>').join('') + '</div>'; return; }
    if (BH.estado === 'error') { $('tabla').innerHTML = BH.errorState('No pudimos leer el inventario de Ayacucho.'); return; }
    const q = $('buscar').value.toLowerCase();
    const l = BH.estado === 'vacio' ? [] : datos.filter((d) => !q || (d.b.titulo + d.b.isbn + d.b.autor).toLowerCase().includes(q));
    if (!l.length) { $('tabla').innerHTML = BH.emptyState('cube', 'Sin resultados', BH.estado === 'vacio' ? 'Esta sucursal todavía no tiene títulos registrados.' : 'Ningún título coincide con tu búsqueda.'); return; }
    $('tabla').innerHTML = `<div class="overflow-x-auto card bg-base-100 border border-base-300"><table class="table">
      <thead><tr><th>Título</th><th class="text-right">Físico</th><th class="text-right">Reservado</th><th class="text-right">Vendible</th><th></th></tr></thead>
      <tbody>${l.map((d) => { const v = d.f - d.r; return `<tr class="hover:bg-base-200/60">
        <td><div class="font-medium">${d.b.titulo}</div><div class="text-xs text-base-content/60">${d.b.autor} · ${d.b.isbn}</div></td>
        <td class="text-right tabular-nums">${d.f}</td><td class="text-right tabular-nums text-warning">${d.r}</td>
        <td class="text-right tabular-nums font-semibold ${v === 0 ? 'text-error' : v <= 2 ? 'text-warning' : 'text-success'}">${v}</td>
        <td class="text-right"><button class="btn btn-sm btn-outline" data-aj="${d.b.id}">Ajustar</button></td></tr>`; }).join('')}</tbody></table></div>`;
    $('tabla').querySelectorAll('[data-aj]').forEach((b) => (b.onclick = () => abrir(Number(b.dataset.aj))));
  }

  function abrir(id) {
    actual = datos.find((d) => d.b.id === id);
    $('aj-titulo').textContent = actual.b.titulo;
    $('aj-info').textContent = `Físico ${actual.f} · reservado ${actual.r} · vendible ${actual.f - actual.r}`;
    $('aj-delta').value = '-1'; prev(); $('dlg-aj').showModal();
  }
  function prev() {
    const d = parseInt($('aj-delta').value, 10), p = $('aj-prev');
    if (isNaN(d) || d === 0) { p.textContent = 'Escribe una cantidad distinta de cero.'; p.className = 'text-sm text-warning'; return false; }
    const nuevoF = actual.f + d, nuevoV = nuevoF - actual.r;
    if (nuevoF < 0 || nuevoV < 0) { p.textContent = `No se puede: el stock vendible quedaría en ${nuevoV}. Como mínimo debe ser 0 (hay ${actual.r} reservadas).`; p.className = 'text-sm text-error'; return false; }
    p.textContent = `Resultado: físico ${nuevoF}, vendible ${nuevoV}.`; p.className = 'text-sm text-success'; return true;
  }
  $('aj-delta').addEventListener('input', prev);
  $('aj-ok').addEventListener('click', () => {
    if (!prev()) return;
    const d = parseInt($('aj-delta').value, 10);
    actual.f += d; actual.b.stock[SID][0] = actual.f;
    BH.audit.add('enc.ayacucho', 'Encargado de sucursal', 'Ajuste de inventario', `Ayacucho · ${actual.b.titulo} · ${d > 0 ? '+' : ''}${d} (${$('aj-motivo').value.toLowerCase()})`);
    $('dlg-aj').close(); kpis(); tabla(); BH.toast('Ajuste registrado y auditado');
  });
  $('buscar').addEventListener('input', tabla);
  kpis(); tabla();
});
</script>
</body>
</html>
