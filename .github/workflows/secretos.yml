name: secretos

# PLA-28: ningún cambio ni imagen con secretos. Corre en cada cambio propuesto y en la rama principal. Nunca usa
# pull_request_target ni secretos del repositorio: un PR desde un fork corre igual, con el token de solo lectura.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secretos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repositorio:
    name: Secretos en el repositorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El historial completo: un secreto ya quitado del árbol sigue en los commits anteriores.
          fetch-depth: 0
          persist-credentials: false
      - name: Buscar secretos en el árbol y en el historial (salida enmascarada)
        run: bash scripts/escanear-secretos.sh repositorio . --historial

  imagenes:
    name: Secretos en las imágenes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Construir y revisar cada imagen de los servicios
        run: |
          set -euo pipefail
          encontrados=0
          while IFS= read -r dockerfile; do
            encontrados=1
            servicio="$(basename "$(dirname "$dockerfile")" | tr '[:upper:]' '[:lower:]')"
            imagen="babelhub-escaneo-${servicio}:ci"
            docker build --file "$dockerfile" --tag "$imagen" .
            bash scripts/escanear-secretos.sh imagen "$imagen"
          done < <(find src -name Dockerfile -not -path '*/obj/*' -not -path '*/bin/*' | sort)
          if [ "$encontrados" -eq 0 ]; then
            echo "Aún no hay Dockerfile en src/: no hay imágenes que revisar (T19 las agrega)."
          fi
