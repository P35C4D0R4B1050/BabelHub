name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  specs:
    name: Specs y trazabilidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validar specs, planes, tareas y matriz de trazabilidad
        run: dotnet run --project tools/SpecCheck

  build-test:
    name: Compilación y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Compilar sin advertencias
        run: dotnet build BabelHub.sln -warnaserror --nologo
      - name: Probar (unitarias, integración y arquitectura)
        run: dotnet test BabelHub.sln --no-build --nologo
