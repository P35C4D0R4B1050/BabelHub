name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  specs:
    name: Specs y trazabilidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Validar specs, planes, tareas y matriz de trazabilidad
        run: dotnet run --project tools/SpecCheck

  build-test:
    name: Compilación y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      # Las pruebas de humo de las imágenes (PLA-03) arrancan los contenedores linux/arm64 en emulación.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Compilar sin advertencias
        run: dotnet build BabelHub.sln -warnaserror --nologo
      - name: Probar Dominio y Aplicación sin red ni base de datos (docker run --network none)
        run: bash scripts/pruebas-sin-red.sh
      # Los guiones de operación y lo que exige Docker de verdad corren en operacion.yml (al tocar scripts/ o infra/ y antes de cada versión).
      - name: Probar con cobertura (unitarias, integración sin guiones ni lanzamiento, arquitectura y herramientas)
        run: dotnet test BabelHub.sln --no-build --nologo --collect:"XPlat Code Coverage" --settings tests/coverlet.runsettings --results-directory TestResults --filter "Categoria!=Lanzamiento&Categoria!=Guiones"
      # Informe por módulo frente a su referencia (PLA-14), que es orientativa: solo falla si no puede leer los informes o falta un servicio (PLA-45).
      - name: Informar la cobertura de cada módulo
        run: dotnet run --project tools/CoverageCheck -- TestResults --html TestResults/reporte-de-cobertura/index.html
      - name: Archivar el reporte HTML de cobertura (evidencia del Sprint 2)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reporte-de-cobertura
          path: TestResults/reporte-de-cobertura/
          if-no-files-found: warn
          retention-days: 30
