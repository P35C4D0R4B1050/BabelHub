name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  specs:
    name: Specs y trazabilidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Validar specs, planes, tareas y matriz de trazabilidad
        run: dotnet run --project tools/SpecCheck

  build-test:
    name: Compilación y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      # Las pruebas de humo de las imágenes (PLA-03) arrancan los contenedores linux/arm64 en emulación.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - name: Compilar sin advertencias
        run: dotnet build BabelHub.sln -warnaserror --nologo
      - name: Probar Dominio y Aplicación sin red ni base de datos (docker run --network none)
        run: bash scripts/pruebas-sin-red.sh
      - name: Probar con cobertura (unitarias, integración, arquitectura y herramientas)
        run: dotnet test BabelHub.sln --no-build --nologo --collect:"XPlat Code Coverage" --settings tests/coverlet.runsettings --results-directory TestResults
      # Mínimos por módulo según su criticidad (PLA-14): críticos 85 % / 70 %, no críticos 60 % / 40 %. La lista está en tools/CoverageCheck/PoliticaDeCobertura.cs.
      - name: Verificar la cobertura de cada módulo según su criticidad
        run: dotnet run --project tools/CoverageCheck -- TestResults --html TestResults/reporte-de-cobertura/index.html
      - name: Archivar el reporte HTML de cobertura (evidencia del Sprint 2)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reporte-de-cobertura
          path: TestResults/reporte-de-cobertura/
          if-no-files-found: warn
          retention-days: 30
