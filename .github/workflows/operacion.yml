name: operacion

# Pruebas lentas apartadas de cada cambio (decisión de la persona responsable, 2026-11-27; docs/07-proceso-de-desarrollo/03-estrategia-de-pruebas.md §6):
# las que ejecutan los guiones de scripts/ (categoría «Guiones») y las que construyen imágenes o usan Docker de verdad («Lanzamiento»).
# Corren al tocar scripts/, infra/, un Dockerfile o esas pruebas, a mano, y siempre antes de publicar una versión: lanzamiento.yml
# llama a este flujo y no construye nada si falla (PLA-31 exige todas las pruebas en un lanzamiento).
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "infra/**"
      - "**/Dockerfile"
      - ".dockerignore"
      - "global.json"
      - "Directory.*.props"
      - "tests/integration/BabelHub.IntegrationTests/Categorias.cs"
      - "tests/integration/BabelHub.IntegrationTests/Almacen/**"
      - "tests/integration/BabelHub.IntegrationTests/Despliegue/**"
      - "tests/integration/BabelHub.IntegrationTests/Imagenes/**"
      - "tests/integration/BabelHub.IntegrationTests/Respaldos/**"
      - "tests/integration/BabelHub.IntegrationTests/SinRed/**"
      - "tests/integration/BabelHub.IntegrationTests/VmAux/**"
      - ".github/workflows/operacion.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "infra/**"
      - "**/Dockerfile"
      - ".dockerignore"
      - "global.json"
      - "Directory.*.props"
      - "tests/integration/BabelHub.IntegrationTests/Categorias.cs"
      - "tests/integration/BabelHub.IntegrationTests/Almacen/**"
      - "tests/integration/BabelHub.IntegrationTests/Despliegue/**"
      - "tests/integration/BabelHub.IntegrationTests/Imagenes/**"
      - "tests/integration/BabelHub.IntegrationTests/Respaldos/**"
      - "tests/integration/BabelHub.IntegrationTests/SinRed/**"
      - "tests/integration/BabelHub.IntegrationTests/VmAux/**"
      - ".github/workflows/operacion.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  operacion:
    name: Guiones y lanzamiento
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # Las pruebas de humo de las imágenes (PLA-03) arrancan los contenedores linux/arm64 en emulación.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - name: Compilar sin advertencias
        run: dotnet build BabelHub.sln -warnaserror --nologo
      # Si el filtro no encontrara ninguna prueba, el paso falla en lugar de pasar en vacío.
      - name: Probar los guiones de operación y lo que exige Docker de verdad
        run: dotnet test tests/integration/BabelHub.IntegrationTests --no-build --nologo --filter "Categoria=Guiones|Categoria=Lanzamiento" -- RunConfiguration.TreatNoTestsAsError=true
