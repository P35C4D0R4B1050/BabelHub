# Actualizaciones de dependencias (Dependabot). Solo abre pull requests; nada se fusiona solo.
# Política del proyecto: versiones fijas, bloqueos de paquetes (`packages.lock.json`), imágenes y acciones fijadas por huella.
# Cada pull request debe pasar `ci.yml` (compilación sin advertencias, pruebas e informe de cobertura) antes de revisarse.
version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      microsoft-y-aspnetcore:
        patterns: ["Microsoft.*", "System.*"]
        update-types: ["minor", "patch"]
      pruebas:
        patterns: ["xunit*", "coverlet*", "Testcontainers*", "NetArchTest*", "Microsoft.NET.Test.Sdk"]
        update-types: ["minor", "patch"]
    labels: ["dependencias", "nuget"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["dependencias", "ci"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: npm
    directory: "/tests/e2e"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: ["dependencias", "e2e"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: docker
    directory: "/src/BabelHub.Ecommerce/BabelHub.Ecommerce.Api"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencias", "imagenes"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: docker
    directory: "/src/BabelHub.Inventario/BabelHub.Inventario.Api"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencias", "imagenes"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: docker
    directory: "/infra/postgres"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencias", "imagenes"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: docker-compose
    directory: "/infra"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencias", "imagenes"]
    commit-message:
      prefix: "chore"
