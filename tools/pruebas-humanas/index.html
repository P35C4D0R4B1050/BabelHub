  if (o.version > APP.esquemaVersion) { informe.errores.push(`${celdaCorta(nombre)}: es de una versión más nueva (${celdaCorta(o.version)}); actualiza esta herramienta.`); return; }
  if (o.version !== APP.esquemaVersion) { informe.errores.push(`${nombre}: versión de esquema no reconocida.`); return; }
  const lista = LISTA(o.participantes, 300).map(normPart).filter(Boolean);
  if (!lista.length) { informe.errores.push(`${nombre}: no trae ninguna persona.`); return; }
  fusionar(lista, informe); informe.archivos++;
}
async function importarArchivos(archivos) {
  const informe = { archivos: 0, agregados: 0, actualizados: 0, conservados: 0, errores: [], avisos: [] };
  for (const f of archivos) { if (f.size > MAX_IMPORT) { informe.errores.push(`${f.name}: pesa más de 5 MB.`); continue; } try { importarTexto(await f.text(), f.name, informe); } catch (e) { informe.errores.push(`${f.name}: no se pudo leer.`); } }
  db.actualizadoEn = ahora(); guardarYa(); if (soloMemoria) informe.errores.push('No se pudo guardar lo importado en este navegador (¿sin espacio o en modo privado?): se perderá al cerrar la pestaña. Descarga lo reunido antes.'); ui.nImport++; ui.informeImport = informe; avisar(`Importación terminada: ${informe.agregados} personas agregadas, ${informe.actualizados} actualizadas.`); render();
}

${c.a.faltan.length ? `<p><strong>Faltan:</strong> ${esc(c.a.faltan.join('; '))}.</p>` : ''}${c.a.faltaVersion.length ? `<p><strong>Falta una segunda versión estable de:</strong> ${esc(c.a.faltaVersion.join('; '))}.</p>` : ''}${c.a.otros.length ? `<p class="muted">Otros navegadores probados (no cuentan para las seis): ${esc(c.a.otros.join('; '))}.</p>` : ''}
<h2>Teclado y lector (AC-WEB-15)</h2>
<p>${chip(c.b.veredicto)} ${plural(c.b.b1, 'persona', 'personas')} con el teclado · ${plural(c.b.b2, 'persona', 'personas')} con lector (${esc(c.b.lectores.join(', ') || 'sin NVDA ni VoiceOver')}) · <strong>${c.b.criticos.length}</strong> incumplimientos críticos · ${c.b.noCriticos} respuestas de 1 o 2 puntos.${c.b.faltan.length ? ` Faltan: ${esc(c.b.faltan.join('; '))}.` : ''}</p>${c.b.criticos.length ? `<ul>${c.b.criticos.map((x) => `<li>${esc(x.codigo)} · ${esc(x.bloque)}: ${esc(x.nota || 'sin nota')}</li>`).join('')}</ul>` : ''}
<h2>Usabilidad (AC-WEB-17)</h2>
<p>${chip(c.c.veredicto)} ${c.c.validas} personas válidas (ronda 1: ${c.c.rondas[1]}, ronda 2: ${c.c.rondas[2]}, sin ronda: ${c.c.rondas.sinRonda}) · sin ayuda ${c.c.sinAyuda} de ${c.c.validas} · SUS promedio ${fmt(c.c.sus)} · errores por tarea ${fmt(c.c.erroresMedia, 2)}.</p>
<h2>Personas</h2>${parts.length ? `<div class="tabla-scroll" role="region" aria-label="Personas reunidas (se desplaza hacia los lados)" tabindex="0"><table><caption>Personas reunidas</caption><thead><tr><th>Código</th><th>Navegador y sistema</th><th>Combinación</th><th>Compra guiada</th><th>Teclado</th><th>Lector</th><th>Usabilidad</th><th>Ronda</th></tr></thead><tbody>${filas}</tbody></table></div>` : alerta('info', '<p>Todavía no hay resultados. Importa archivos o haz tú las tareas.</p>')}
${c.avisos.length ? alerta('warn', `<p><strong>Avisos de la app</strong> (se incluyen en el archivo):</p><ul>${c.avisos.slice(0, 30).map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`) : ''}
<h2>Descargar lo reunido</h2>
<div class="row"><button type="button" class="btn pri" data-accion="exportar" data-id="descargar" data-q="todo"${parts.length ? '' : ' disabled'}>Descargar todo (JSON y resumen)</button></div>
${hall.length ? alerta('err', `<p><strong>Posibles datos personales.</strong> Revisa antes de guardarlo en el repositorio:</p><ul>${hall.slice(0, 20).map((h) => `<li><span class="kbd">${esc(h.ruta)}</span>: ${esc(h.motivo)}</li>`).join('')}</ul>`) : ''}
<h2>Borrar los datos locales</h2>
<div class="card"><p>Borra <strong>todo</strong> lo guardado en este navegador: tus respuestas y las personas importadas. No toca los archivos que ya descargaste.</p><button type="button" class="btn peligro" data-accion="borrarTodo">Borrar los datos locales…</button></div>
<p class="muted">Versión ${APP.version} · esquema ${APP.esquema} v${APP.esquemaVersion}. Sin red, sin telemetría.</p>` };
}

/* ============================== Enrutamiento y render ============================== */
const rutaActual = () => location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
function vista() {
  const [s, id] = rutaActual(); const p = yo();
  if (!s) return p.bienvenida ? vistaInicio() : { redirigir: '#/bienvenida' };
  if (s === 'bienvenida') return vistaBienvenida();
  if (s === 'avanzado') return vistaAvanzado();
  if (s === 'gracias') return p.bienvenida ? vistaGracias() : { redirigir: '#/bienvenida' };
  if (s === 't' && TAREAS[id]) { if (!p.bienvenida) return { redirigir: '#/bienvenida' }; entrarTarea(id); return vistaTarea(id); }
  return { redirigir: '#/' };
}
function entrarTarea(id) {
  const b = yo()[id];
  if (b.estado === 'pendiente') { b.estado = 'en-curso'; }
  if (!b.iniciadoEn) { b.iniciadoEn = ahora(); guardar(); }
}
function huellaFoco(el) {
  if (!el || el === document.body || !main.contains(el)) return null;
  const partes = [el.tagName.toLowerCase()];
  ['campo', 'accion', 'id', 'p', 'captura'].forEach((k) => { if (el.dataset[k] !== undefined) partes.push(`[data-${k}="${CSS.escape(el.dataset[k])}"]`); });
  if (partes.length === 1 && !el.id) return null;
  if (el.type === 'radio') partes.push(`[value="${CSS.escape(el.value)}"]`);
  return partes.join('');
}
let cargaInicial = true;
function render(opciones = {}) {
  const foco = opciones.enfocarTitulo ? null : huellaFoco(document.activeElement);
  const y = window.scrollY;
  const v = vista();
  if (v.redirigir) { location.hash = v.redirigir; return; }
  main.innerHTML = v.html; document.title = `${v.titulo} · Prueba de la tienda BabelHub`;
  pintarEstado(); pintarBotonTema();
  if (opciones.enfocarTitulo) { const e = $('#error-paso', main) || $('h1', main); if (e && !cargaInicial) e.focus({ preventScroll: true }); window.scrollTo(0, 0); }
  else { if (foco) { try { const el = main.querySelector(foco); if (el) el.focus({ preventScroll: true }); } catch (e) { /* sin foco previo */ } } window.scrollTo(0, y); }
  cargaInicial = false; // al abrir la página no se roba el foco: el primer Tab llega a «Saltar al contenido»
}
window.addEventListener('hashchange', () => { ui.error = ''; if (rutaActual()[0] !== undefined) ui.mensaje = ''; render({ enfocarTitulo: true }); });

/* ============================== Eventos ============================== */
function valorDe(t) {
  if (t.type === 'checkbox') return t.checked;
  if (t.dataset.tipo === 'num' || t.type === 'number') return t.value === '' ? null : Number(t.value);
  return t.value;
}
function aplicarCampo(t) {
  const { campo, p: pid } = t.dataset; const per = persona(pid); if (!per) return false;
  let v = valorDe(t);
  if (campo === 'tienda.urlTexto') { ui.urlTexto = String(v).slice(0, 300); return true; }
  const m = campo.match(/^(a\.raro\.tipos)\.(\w+)$/);
  if (m) { const lista = per.a.raro.tipos.filter((x) => x !== m[2]); if (v) lista.push(m[2]); per.a.raro.tipos = lista; }
  else if (/^(?:b1|b2)\.items\.\w+\.na$/.test(campo)) { ponerRuta(per, campo, v === true); if (v === true) ponerRuta(per, campo.replace(/\.na$/, '.v'), null); }
  else if (/^(?:b1|b2)\.items\.\w+\.v$/.test(campo)) { ponerRuta(per, campo, v); ponerRuta(per, campo.replace(/\.v$/, '.na'), false); }
  else if (campo === 'c.consentimiento.acepta') { ponerRuta(per, campo, v); per.c.consentimiento.fecha = v ? ahora() : ''; }
  else if (campo === 'c.tarea.minutosReales') ponerRuta(per, campo, v !== null && v >= 0 && v <= 600 ? Math.round(v) : null);
  else if (campo.startsWith('c.sus.')) ponerRuta(per, campo.replace(/\.v$/, ''), v);
  else ponerRuta(per, campo, v);
  if (campo === 'entorno.version' || campo === 'entorno.navegador' || campo === 'entorno.sistema' || campo === 'entorno.dispositivo') per.entorno.corregido = true;
  if (per === db.yo) guardar(); else { per.act = ahora(); guardar(); }
  return true;
}
document.addEventListener('input', (e) => {
  const t = e.target; if (!t.dataset || !t.dataset.campo) return;
  if (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && !['radio', 'checkbox', 'file'].includes(t.type))) {
    aplicarCampo(t);
    if (t.dataset.pii) { const h = t.closest('label').nextElementSibling; const m = pareceDatoPersonal(t.value); if (h && h.classList.contains('pii')) h.textContent = m ? `Cuidado: esto ${m}. No escribas nombres, correos ni teléfonos.` : ''; }
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'archivo-json' && t.files && t.files.length) { importarArchivos(Array.from(t.files)); t.value = ''; return; }
  if (t.dataset && t.dataset.captura) { const f = t.files && t.files[0]; if (f) { yo().a.pasos[t.dataset.captura].captura = S(f.name, 120); guardar(); render(); } return; }
  if (!t.dataset || !t.dataset.campo) return;
  const esDiscreto = t.type === 'radio' || t.type === 'checkbox' || t.tagName === 'SELECT';
  if (!esDiscreto) { aplicarCampo(t); return; }
  if (aplicarCampo(t)) { ui.error = ''; render(); }
});

function dialogo({ titulo, cuerpo, aceptar, peligro = false, alAceptar }) {
  const d = $('#dlg');
  d.innerHTML = `<h2 id="dlg-t" style="margin-top:0">${esc(titulo)}</h2>${cuerpo}<div class="row sep" style="margin-top:1rem"><button type="button" class="btn" data-accion="dlgCancelar" autofocus>Cancelar</button><button type="button" class="btn ${peligro ? 'peligro' : 'pri'}" data-accion="dlgAceptar">${esc(aceptar)}</button></div>`;
  ui.dlgAceptar = alAceptar;
  if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
}
const cerrarDialogo = () => { const d = $('#dlg'); if (d.close) d.close(); else d.removeAttribute('open'); };
function borrarMios() {
  dialogo({ titulo: 'Borrar mis datos', cuerpo: `<p>Se borra todo lo que respondiste en este dispositivo.${sinExportar() && db.yo.bienvenida ? ' <strong>Todavía no descargaste tu resultado.</strong>' : ''} Los archivos que ya descargaste no se tocan. No se puede deshacer.</p>`, aceptar: 'Sí, borrar', peligro: true, alAceptar: reiniciarTodo });
}
function borrarTodo() {
  dialogo({ titulo: 'Borrar los datos locales', cuerpo: `<p>Se borrará <strong>todo</strong> lo guardado en este navegador: tus respuestas y las personas importadas.${sinExportar() && hayDatos() ? ' <strong>Hay cambios sin descargar.</strong>' : ''}</p><p>Los archivos que ya descargaste no se tocan. Esto no se puede deshacer.</p>`, aceptar: 'Sí, borrar todo', peligro: true, alAceptar: reiniciarTodo });
}
function reiniciarTodo() {
  try { localStorage.removeItem(LS_DATOS); } catch (e) { /* sin almacenamiento */ }
  db = dbVacia(); ui.informeImport = null; ui.exportAviso = []; ui.descargado = false; ui.corrigiendo = false; ui.urlTexto = '';
  if (entornoLeido) aplicarDeteccion(entornoLeido); aplicarParametros(); guardarYa(); location.hash = '#/bienvenida'; render({ enfocarTitulo: true }); avisar('Datos borrados.');
}
function irSiguiente(id) {
  const T = TAREAS[id]; const b = yo()[id]; const i = pasoActual(id); const P = T.pasos[i];
  const err = P.valida(yo());
  if (err) { ui.error = err; render({ enfocarTitulo: true }); return; }
  ui.error = '';
  if (i < T.pasos.length - 1) { b.paso = i + 1; guardarYa(); render({ enfocarTitulo: true }); avisar(`Paso ${i + 2} de ${T.pasos.length}.`); return; }
  b.estado = 'hecha'; b.terminadoEn = ahora(); b.paso = 0; guardarYa();
  ui.mensaje = `Tarea «${T.titulo}» lista. ¡Gracias!`; location.hash = nResueltas(yo()) === 3 ? '#/gracias' : '#/';
}
function tickCrono() {
  const cr = $('#crono'); if (!cr) return;
  const t = yo().c.tarea; if (!t.inicio || t.fin) return;
  const s = Math.floor((Date.now() - t.inicio) / 1000); cr.textContent = mmss(s);
  const l = $('#limite'); if (l && s >= LIMITE_TAREA_SEG && l.hidden) { l.hidden = false; avisar('Ya pasaron 15 minutos. Si no lograste terminar, pulsa «No pude terminarla».'); }
}
setInterval(tickCrono, 500);
function cerrarCrono(abandono) {
  const t = yo().c.tarea; t.fin = Date.now(); t.tiempoSeg = Math.max(0, Math.round((t.fin - t.inicio) / 1000)); t.abandono = abandono;
  if (abandono) t.lograste = 'no';
  guardarYa(); ui.error = ''; render({ enfocarTitulo: true }); avisar(`Tiempo registrado: ${mmss(t.tiempoSeg)}.`);
}

document.addEventListener('click', (e) => {
  if (e.target.closest('.skip')) { e.preventDefault(); main.focus(); main.scrollIntoView(); return; }
  const b = e.target.closest('[data-accion]'); if (!b || ['INPUT', 'SELECT', 'TEXTAREA'].includes(b.tagName)) return;
  const { accion, id, q } = b.dataset; const p = yo();
  switch (accion) {
    case 'tema': ciclarTema(); break;
    case 'corregir': ui.corrigiendo = true; render(); break;
    case 'confirmarEntorno': p.entorno.confirmado = true; p.entorno.corregido = false; ui.errBienvenida = ''; guardarYa(); render(); avisar('Navegador confirmado.'); break;
    case 'guardarEntorno': { const e2 = p.entorno; if (!e2.navegador || !e2.sistema || !e2.dispositivo) { ui.errBienvenida = 'Elige el navegador, el sistema y el tipo de aparato.'; render({ enfocarTitulo: true }); break; } e2.confirmado = true; e2.corregido = true; ui.corrigiendo = false; ui.errBienvenida = ''; guardarYa(); render(); avisar('Datos guardados.'); break; }
    case 'empezar': {
      if (!p.entorno.confirmado) { ui.errBienvenida = 'Antes de seguir, confirma tu navegador: «Sí, es correcto» o «No, corregir».'; render({ enfocarTitulo: true }); break; }
      if (!p.tienda.url) { const u = urlSegura(ui.urlTexto || ''); if (!u) { ui.errBienvenida = 'Escribe la dirección de la tienda de prueba. Debe empezar con https:// (o http://).'; render({ enfocarTitulo: true }); break; } p.tienda.url = u; }
      ui.errBienvenida = ''; p.bienvenida = true; guardarYa(); location.hash = '#/'; render({ enfocarTitulo: true }); break;
    }
    case 'cambiarTienda': p.tienda.url = ''; ui.urlTexto = ''; guardarYa(); render(); break;
    case 'siguiente': irSiguiente(id); break;
    case 'atras': { const T = Object.keys(TAREAS).find((k) => rutaActual()[1] === k); if (T) { const bl = p[T]; bl.paso = Math.max(0, pasoActual(T) - 1); ui.error = ''; guardarYa(); render({ enfocarTitulo: true }); } break; }
    case 'omitir': { p.b1.estado = 'omitida'; p.b1.terminadoEn = ahora(); guardarYa(); ui.mensaje = 'Saltaste la tarea del teclado. No pasa nada.'; location.hash = nResueltas(p) === 3 ? '#/gracias' : '#/'; break; }
    case 'quitarCaptura': p.a.pasos[id].captura = ''; guardar(); render(); break;
    case 'cronoIniciar': { const t = p.c.tarea; t.inicio = Date.now(); t.fin = null; t.tiempoSeg = null; t.abandono = false; p.c.despuesDeA = p.a.iniciadoEn !== ''; guardarYa(); render(); const ft = main.querySelector('[data-accion="cronoTermine"]'); if (ft) ft.focus({ preventScroll: true }); avisar('La tarea empezó. El tiempo corre.'); break; }
    case 'cronoTermine': cerrarCrono(false); break;
    case 'cronoAbandono': cerrarCrono(true); break;
    case 'cronoReiniciar': dialogo({ titulo: 'Volver a empezar', cuerpo: '<p>Se borra el tiempo medido y empiezas la tarea otra vez.</p>', aceptar: 'Volver a empezar', alAceptar: () => { const t = p.c.tarea; t.inicio = null; t.fin = null; t.tiempoSeg = null; t.abandono = false; guardarYa(); render(); } }); break;
    case 'exportar': exportar(id, q); break;
    case 'borrarMios': borrarMios(); break;
    case 'borrarTodo': borrarTodo(); break;
    case 'togglePegar': ui.pegar = !ui.pegar; render(); break;
    case 'importarPegado': { const t = $('#pegado'); const informe = { archivos: 0, agregados: 0, actualizados: 0, conservados: 0, errores: [], avisos: [] }; importarTexto(t ? t.value : '', 'texto pegado', informe); db.actualizadoEn = ahora(); guardarYa(); ui.nImport++; ui.informeImport = informe; render(); break; }
    case 'dlgCancelar': cerrarDialogo(); break;
    case 'dlgAceptar': { const f = ui.dlgAceptar; cerrarDialogo(); if (f) f(); break; }
    default: break;
  }
});

/* ============================== Tema ============================== */
function preferenciaTema() { try { return localStorage.getItem(LS_TEMA) || 'sistema'; } catch (e) { return 'sistema'; } }
function aplicarTema() {
  const pref = preferenciaTema();
  const oscuro = pref === 'oscuro' || (pref === 'sistema' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', oscuro ? 'babelhub-dark' : 'babelhub');
}
function pintarBotonTema() { const b = $('#btn-tema'); if (!b) return; const p = preferenciaTema(); b.textContent = `Tema: ${p === 'sistema' ? 'sistema' : p}`; b.setAttribute('aria-label', `Cambiar tema. Ahora: ${p === 'sistema' ? 'el del sistema' : p}`); }
function ciclarTema() { const orden = ['sistema', 'claro', 'oscuro']; const n = orden[(orden.indexOf(preferenciaTema()) + 1) % 3]; try { localStorage.setItem(LS_TEMA, n); } catch (e) { /* sin almacenamiento */ } aplicarTema(); pintarBotonTema(); avisar(`Tema ${n === 'sistema' ? 'del sistema' : n}.`); }
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicarTema);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#dlg').open) cerrarDialogo(); });

/* ============================== Arranque ============================== */
async function iniciar() {
  aplicarTema();
  entornoLeido = await leerEntorno();
  aplicarDeteccion(entornoLeido); aplicarParametros(); guardarYa();
  render();
}
window.__babelhubPruebasHumanas = { clasificar, comboDe, puntajeSUS, calcular, construirExport, construirMarkdown, normalizarDb, normPart, buscarDatosPersonales, urlSegura, listo: iniciar() };
})();
</script>
