function buscarDatosPersonales(raiz) {
  const hallazgos = [];

    if (typeof v === 'string') {
      if (/[\w.+-]+@[\w-]+\.[\w.-]+/.test(v)) hallazgos.push({ ruta, motivo: 'parece un correo electrónico' });
      else if (/\d[\d\s-]{6,}\d/.test(v)) hallazgos.push({ ruta, motivo: 'tiene una secuencia larga de dígitos (¿teléfono o documento?)' });
    } else if (Array.isArray(v)) v.forEach((x, i) => ir(x, `${ruta}[${i}]`));
    else if (v && typeof v === 'object') Object.keys(v).forEach((k) => { if (!SIN_ESCANEAR.has(k)) ir(v[k], ruta ? `${ruta}.${k}` : k); });
  })(raiz, '');

}

/* ============================== Importación y fusión ============================== */
function fusionar(entrante, informe) {
  const mezclar = (lista, nuevos) => nuevos.forEach((n) => {
    const i = lista.findIndex((x) => x.id === n.id);
    if (i < 0) { lista.push(n); informe.agregados++; } else if (n.act > lista[i].act) { lista[i] = n; informe.actualizados++; } else informe.conservados++;
  });
  mezclar(db.a.corridas, entrante.a.corridas); mezclar(db.b.sesiones, entrante.b.sesiones); mezclar(db.c.personas, entrante.c.personas);
  entrante.c.rondas.forEach((r) => { const loc = db.c.rondas[r.ronda - 1]; if (r.act > loc.act) { db.c.rondas[r.ronda - 1] = r; informe.actualizados++; } });
}
function importarTexto(texto, nombre, informe) {
  if (texto.length > MAX_IMPORT) { informe.errores.push(`${nombre}: pesa más de 5 MB.`); return; }
  let o; try { o = JSON.parse(texto); } catch (e) { informe.errores.push(`${nombre}: no es un JSON válido.`); return; }
  if (!o || o.esquema !== APP.esquema) { informe.errores.push(`${nombre}: no es un archivo de esta herramienta (esquema «${APP.esquema}»).`); return; }
  if (o.version > APP.esquemaVersion) { informe.errores.push(`${nombre}: es de una versión más nueva del esquema (${o.version}); actualiza esta herramienta.`); return; }
  const e = normalizarDb(o);
  if (!e) { informe.errores.push(`${nombre}: contenido no reconocido.`); return; }
  if (e.dispositivo.id === db.dispositivo.id) informe.avisos.push(`${nombre}: viene de este mismo dispositivo; solo se aplican los cambios más recientes.`);
  fusionar(e, informe); informe.archivos++;
  if (!db.importados.some((i) => i.dispositivoId === e.dispositivo.id && i.exportadoEn === ISO(o.exportadoEn))) db.importados.push({ dispositivoId: e.dispositivo.id, evaluador: e.dispositivo.evaluador, exportadoEn: ISO(o.exportadoEn), importadoEn: ahora() });
}
async function importarArchivos(archivos) {
  const informe = { archivos: 0, agregados: 0, actualizados: 0, conservados: 0, errores: [], avisos: [] };
  for (const f of archivos) { if (f.size > MAX_IMPORT) { informe.errores.push(`${f.name}: pesa más de 5 MB.`); continue; } try { importarTexto(await f.text(), f.name, informe); } catch (e) { informe.errores.push(`${f.name}: no se pudo leer.`); } }
  db.actualizadoEn = ahora(); guardarYa(); ui.informeImport = informe; avisar(`Importación terminada: ${informe.agregados} agregados, ${informe.actualizados} actualizados.`); render();
}

function ponerRuta(rec, ruta, v) {
  const k = ruta.split('.'); let o = rec;
  if (k.some((x) => x === '__proto__' || x === 'constructor' || x === 'prototype')) return;
  for (let i = 0; i < k.length - 1; i++) { if (o[k[i]] === undefined || o[k[i]] === null) o[k[i]] = {}; o = o[k[i]]; }

/* ---------- C ---------- */
function estadoPersona(p) {
  if (p.excluida) return 'excluida';
  const algo = p.consentimiento.acepta || p.tarea.resultado || p.sus.some((v) => v !== null) || p.tarea.cron.acumMs || p.tarea.cron.corriendo;
  if (!algo) return 'nueva';
  return p.consentimiento.acepta && p.tarea.resultado && puntajeSUS(p.sus) !== null && p.tarea.tiempoSeg !== null ? 'completa' : 'en-curso';
}
function chipPersona(p) {
  const e = estadoPersona(p);
  return e === 'excluida' ? '<span class="chip warn"><span aria-hidden="true">⚠</span> Excluida</span>' : e === 'completa' ? chip('cumple', 'Completa') : e === 'nueva' ? chip('pendiente', 'Sin empezar') : chip('en-curso');
}
function resumenCriterios(r) {
  return tabla(`Resumen de la ronda ${r.ronda}`, `<table><caption>Resumen de la ronda ${r.ronda} (referencia: la meta formal es el acumulado de las dos rondas)</caption><thead><tr><th scope="col">Indicador</th><th scope="col">Ronda</th><th scope="col">Meta</th></tr></thead><tbody>
<tr><th scope="row">Personas válidas con resultado</th><td class="num">${r.validas} de 5${r.excluidas ? ` (${r.excluidas} excluidas)` : ''}</td><td>5</td></tr>
<tr><th scope="row">Éxito sin ayuda</th><td class="num">${r.sinAyuda} de ${r.validas}</td><td>≥ 9 de 10 en total</td></tr>
<tr><th scope="row">SUS promedio</th><td class="num">${fmt(r.sus)} (${r.susN} cuestionarios) ${r.cumpleSUS === null ? '' : r.cumpleSUS ? chip('cumple') : chip('no-cumple')}</td><td>≥ 68</td></tr>
<tr><th scope="row">Errores por tarea</th><td class="num">${fmt(r.erroresMedia, 2)} ${r.cumpleErrores === null ? '' : r.cumpleErrores ? chip('cumple') : chip('no-cumple')}</td><td>&lt; 1</td></tr>
<tr><th scope="row">Tiempo mediano</th><td class="num">${r.tiempoMediana === null ? '—' : mmss(r.tiempoMediana)}</td><td>—</td></tr>
<tr><th scope="row">Con tecnología de apoyo</th><td class="num">${r.conTecApoyo}</td><td>al menos 1</td></tr>
<tr><th scope="row">Problemas de gravedad 3 o 4</th><td class="num">${r.graves}</td><td>bloquean «Done»</td></tr></tbody></table>`);
}

<h2>Problemas principales observados</h2>

/* ============================== Enrutamiento y render ============================== */
function rutaActual() { return location.hash.replace(/^#\/?/, '').split('/').filter(Boolean); }
function vista() {
  const [s, id] = rutaActual();
  let v = null;
  if (!s) v = vistaInicio(); else if (s === 'a') v = id ? vistaCorrida(id) : vistaA(); else if (s === 'b') v = id ? vistaSesion(id) : vistaB(); else if (s === 'c') v = id ? vistaPersona(id) : vistaC(); else if (s === 'datos') v = vistaDatos();
  return v || { redirigir: s ? '#/' + s : '#/' };
}
function huellaFoco(el) {
  if (!el || el === document.body || !main.contains(el)) return null;
  const partes = [el.tagName.toLowerCase()];
  ['col', 'rec', 'campo', 'accion', 'id', 'p'].forEach((k) => { if (el.dataset[k] !== undefined) partes.push(`[data-${k}="${CSS.escape(el.dataset[k])}"]`); });
  if (partes.length === 1 && !el.id) return null;
  if (el.type === 'radio' || el.type === 'checkbox') partes.push(`[value="${CSS.escape(el.value)}"]`);
  return partes.join('');
}
function render(opciones = {}) {
  const foco = opciones.enfocarTitulo ? null : huellaFoco(document.activeElement);
  const y = window.scrollY;
  const v = vista();
  if (v.redirigir) { location.hash = v.redirigir; return; }
  main.innerHTML = v.html; document.title = `${v.titulo} · Pruebas humanas de BabelHub`;
  const [s] = rutaActual();
  document.querySelectorAll('nav.tabs a').forEach((a) => { if (a.dataset.ruta === (s || '')) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  pintarEstado(); pintarBotonTema();
  if (opciones.enfocarTitulo) { const h = $('h1', main); if (h) h.focus({ preventScroll: true }); window.scrollTo(0, 0); }
  else { if (foco) { try { const el = main.querySelector(foco); if (el) el.focus({ preventScroll: true }); } catch (e) { /* sin foco previo */ } } window.scrollTo(0, y); }
}
window.addEventListener('hashchange', () => render({ enfocarTitulo: true }));
document.addEventListener('toggle', (e) => { const d = e.target; if (d && d.tagName === 'DETAILS' && d.dataset.k) { if (d.open) { ui.abiertos.add(d.dataset.k); ui.abiertos.delete('~' + d.dataset.k); } else { ui.abiertos.delete(d.dataset.k); ui.abiertos.add('~' + d.dataset.k); } } }, true);

function valorDe(t) {
  if (t.type === 'checkbox') return t.checked;
  if (t.dataset.tipo === 'num' || t.type === 'number') return t.value === '' ? null : Number(t.value);
  return t.value;
}
function aplicarCampo(t) {
  const { col, rec, campo } = t.dataset;
  if (col === 'x') { ui.rondaC = Number(t.value) === 2 ? 2 : 1; return true; }
  const r = buscar(col, rec); if (!r) return false;
  let v = valorDe(t);
  if (campo === 'tarea.tiempoSeg' && v !== null) v = Math.max(0, Math.round(v));
  if (campo === 'gravedad') v = v === '' ? null : Number(v);
  ponerRuta(r, campo, v);
  if (col === 'c' && campo === 'consentimiento.acepta') r.consentimiento.fecha = v ? ahora() : '';
  if (col === 'd' || col === 'p') guardar(); else tocar(r);
  return true;
}
document.addEventListener('input', (e) => { const t = e.target; if (t.dataset && t.dataset.campo && (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && !['radio', 'checkbox'].includes(t.type)))) aplicarCampo(t); });
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'archivo-json' && t.files && t.files.length) { importarArchivos(Array.from(t.files)); t.value = ''; return; }
  if (!t.dataset || !t.dataset.campo) return;
  const esDiscreto = t.type === 'radio' || t.type === 'checkbox' || t.tagName === 'SELECT';
  if (!esDiscreto) { aplicarCampo(t); if (t.dataset.campo === 'urlTienda') render(); return; }
  if (aplicarCampo(t)) render();
});

function dialogo({ titulo, cuerpo, aceptar, peligro = false, alAceptar }) {
  const d = $('#dlg');
  d.innerHTML = `<h2 id="dlg-t" style="margin-top:0">${esc(titulo)}</h2>${cuerpo}<div class="row sep" style="margin-top:1rem"><button type="button" class="btn" data-accion="dlgCancelar" autofocus>Cancelar</button><button type="button" class="btn ${peligro ? 'peligro' : 'pri'}" data-accion="dlgAceptar">${esc(aceptar)}</button></div>`;
  ui.dlgAceptar = alAceptar;
  if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
}
const cerrarDialogo = () => { const d = $('#dlg'); if (d.close) d.close(); else d.removeAttribute('open'); };

function nuevaCorrida(comboId) {
  const cb = COMBOS.find((c) => c.id === comboId); const d = detectar();
  const coincide = d.nav === cb.nombre;
  const r = normCorrida({ id: nuevoId('run'), act: ahora(), creada: ahora(), combo: comboId, evaluador: evalor(), dispositivoId: db.dispositivo.id, navegador: cb.nombre, version: coincide ? d.ver : '', sistema: coincide ? d.sis : '', fecha: hoy(), viewport: coincide ? d.vp : '', ua: coincide ? d.ua : '' });
  db.a.corridas.push(r); guardar(); location.hash = '#/a/' + r.id;
}
function nuevaSesion(lector, tema) {
  const d = detectar();
  const s = normSesion({ id: nuevoId('ses'), act: ahora(), creada: ahora(), lector, tema, evaluador: evalor(), dispositivoId: db.dispositivo.id, fecha: hoy(), sistema: d.sis, navegador: d.nav ? `${d.nav} ${d.ver}` : '' });
  db.b.sesiones.push(s); guardar(); location.hash = '#/b/' + s.id;
}
function nuevaPersona(ronda) {
  const maxN = db.c.personas.reduce((m, p) => { const x = /^P(\d+)$/.exec(p.codigo); return x ? Math.max(m, Number(x[1])) : m; }, 0);
  const d = detectar();
  const p = normPersona({ id: nuevoId('per'), act: ahora(), creada: ahora(), ronda, codigo: 'P' + (maxN + 1), evaluador: evalor(), dispositivoId: db.dispositivo.id, dispositivo: /Mobi|Android|iPhone/.test(d.ua) ? 'celular' : 'computadora' });
  db.c.personas.push(p); guardar(); ui.pasoC[p.id] = 1; location.hash = '#/c/' + p.id;
}
function borrarRegistro(clave) {
  const [col, id] = [clave.slice(0, 1), clave.slice(2)];
  const nombre = col === 'a' ? 'esta corrida' : col === 'b' ? 'esta sesión' : 'a esta persona';
  dialogo({ titulo: 'Borrar el registro', cuerpo: `<p>Se borra ${esc(nombre)} y todo lo anotado en ella. No se puede deshacer.</p>`, aceptar: 'Borrar', peligro: true, alAceptar: () => {
    if (col === 'a') db.a.corridas = db.a.corridas.filter((x) => x.id !== id); else if (col === 'b') db.b.sesiones = db.b.sesiones.filter((x) => x.id !== id); else db.c.personas = db.c.personas.filter((x) => x.id !== id);
    guardarYa(); location.hash = '#/' + col; avisar('Registro borrado.');
  } });
}
function borrarTodo() {
  dialogo({ titulo: 'Borrar los datos locales', cuerpo: `<p>Se borrará <strong>todo</strong> lo guardado en este navegador: corridas, sesiones, personas y ajustes.${sinExportar() && hayDatos() ? ' <strong>Hay cambios sin exportar.</strong>' : ''}</p><p>Los archivos que ya exportaste no se tocan. Esto no se puede deshacer.</p>`, aceptar: 'Sí, borrar todo', peligro: true, alAceptar: () => {
    try { localStorage.removeItem(LS_DATOS); } catch (e) { /* sin almacenamiento */ }
    db = dbVacia(); ui.informeImport = null; ui.exportAviso = []; ui.verTexto = ''; guardarYa(); location.hash = '#/datos'; render({ enfocarTitulo: true }); avisar('Datos locales borrados.');
  } });
}
const enfocar = (sel) => { const el = main.querySelector(sel); if (el) el.focus({ preventScroll: true }); };
const persona = (id) => db.c.personas.find((p) => p.id === id);
function tickCrono() {
  const cr = $('#crono');
  if (cr) { const p = persona((location.hash.match(/#\/c\/([^/]+)/) || [])[1]); if (p) { cr.textContent = mmss(cronoSeg(p)); const b = $('#bloqueo'); if (b && p.tarea.cron.bloqueoInicio) { const s = Math.floor((Date.now() - p.tarea.cron.bloqueoInicio) / 1000); b.textContent = mmss(s); const m = $('#bloqueo-msg'); if (m && s >= 120 && m.style.display === 'none') { m.style.display = ''; avisar('Ya pasaron 2 minutos de bloqueo: puedes ayudar y cuenta como con ayuda.'); } } } }
}
setInterval(tickCrono, 500);

document.addEventListener('click', (e) => {
  if (e.target.closest('.skip')) { e.preventDefault(); main.focus(); main.scrollIntoView(); return; } // el enlace no cambia la ruta (#/…)
  const b = e.target.closest('[data-accion]'); if (!b || b.tagName === 'INPUT' || b.tagName === 'SELECT' || b.tagName === 'TEXTAREA') return;
  const { accion, id, p } = b.dataset;
  switch (accion) {
    case 'tema': ciclarTema(); break;
    case 'nuevaCorrida': nuevaCorrida(id); break;
    case 'nuevoDefecto': { const r = buscar('a', id); r.defectos.push({ id: nuevoId('def'), paso: 'otro', desc: '', captura: '', gravedad: 'mayor' }); tocar(r); render(); break; }
    case 'quitarDefecto': { const r = buscar('a', id); r.defectos = r.defectos.filter((d) => d.id !== p); tocar(r); render(); break; }
    case 'nuevaSesion': nuevaSesion(id, p); break;
    case 'todoCumple': { const s = buscar('b', id); itemsDe(s.lector).forEach((it) => { const x = s.pantallas[p].items[it.id]; if (!x.e) x.e = 'ok'; }); tocar(s); render(); avisar('Lo pendiente se marcó como cumple.'); break; }
    case 'borrarRegistro': borrarRegistro(id); break;
    case 'borrarTodo': borrarTodo(); break;
    case 'nuevaPersona': nuevaPersona(Number(id)); break;
    case 'pasoC': ui.pasoC[id] = Number(p); render({ enfocarTitulo: true }); break;
    case 'cronoIniciar': { const x = persona(id); x.tarea.cron.corriendo = true; x.tarea.cron.inicio = Date.now(); tocar(x); render(); enfocar('[data-accion="cronoDetener"]'); break; }
    case 'cronoDetener': { const x = persona(id); const c = x.tarea.cron; c.acumMs += Date.now() - c.inicio; c.corriendo = false; c.inicio = null; c.bloqueoInicio = null; x.tarea.tiempoSeg = Math.round(c.acumMs / 1000); tocar(x); render(); enfocar('[data-accion="cronoIniciar"]'); avisar(`Tiempo registrado: ${mmss(x.tarea.tiempoSeg)}.`); break; }
    case 'cronoReiniciar': dialogo({ titulo: 'Poner el cronómetro en cero', cuerpo: '<p>Se pierde el tiempo medido. Los errores y ayudas anotados no se borran.</p>', aceptar: 'Poner en cero', peligro: true, alAceptar: () => { const x = persona(id); x.tarea.cron = { corriendo: false, inicio: null, acumMs: 0, bloqueoInicio: null }; x.tarea.tiempoSeg = null; tocar(x); render(); } }); break;
    case 'bloqueoIni': { const x = persona(id); x.tarea.cron.bloqueoInicio = Date.now(); tocar(x); render(); break; }
    case 'bloqueoFin': { const x = persona(id); x.tarea.cron.bloqueoInicio = null; tocar(x); render(); break; }
    case 'ayuda': { const x = persona(id); x.tarea.ayudas.push({ t: cronoSeg(x), tipo: 'ayuda', nota: '' }); x.tarea.cron.bloqueoInicio = null; tocar(x); render(); avisar('Ayuda registrada: cuenta como con ayuda.'); break; }
    case 'error': { const x = persona(id); x.tarea.errores.push({ t: cronoSeg(x), tipo: p, nota: '' }); tocar(x); render(); avisar(`Error registrado. Total: ${x.tarea.errores.length}.`); break; }
    case 'deshacerError': { const x = persona(id); x.tarea.errores.pop(); tocar(x); render(); break; }
    case 'exportar': exportar(id); break;
    case 'togglePegar': ui.pegar = !ui.pegar; render(); break;
    case 'importarPegado': { const t = $('#pegado'); const informe = { archivos: 0, agregados: 0, actualizados: 0, conservados: 0, errores: [], avisos: [] }; importarTexto(t ? t.value : '', 'texto pegado', informe); db.actualizadoEn = ahora(); guardarYa(); ui.informeImport = informe; render(); break; }
    case 'dlgCancelar': cerrarDialogo(); break;
    case 'dlgAceptar': { const f = ui.dlgAceptar; cerrarDialogo(); if (f) f(); break; }
    default: break;
  }
});

/* ============================== Tema ============================== */
function preferenciaTema() { try { return localStorage.getItem(LS_TEMA) || 'sistema'; } catch (e) { return 'sistema'; } }
function aplicarTema() {
  const pref = preferenciaTema();
  const oscuro = pref === 'oscuro' || (pref === 'sistema' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', oscuro ? 'babelhub-dark' : 'babelhub');
}
function pintarBotonTema() { const b = $('#btn-tema'); if (!b) return; const p = preferenciaTema(); b.textContent = `Tema: ${p === 'sistema' ? 'sistema' : p}`; b.setAttribute('aria-label', `Cambiar tema. Ahora: ${p === 'sistema' ? 'el del sistema' : p}`); }
function ciclarTema() { const orden = ['sistema', 'claro', 'oscuro']; const n = orden[(orden.indexOf(preferenciaTema()) + 1) % 3]; try { localStorage.setItem(LS_TEMA, n); } catch (e) { /* sin almacenamiento */ } aplicarTema(); pintarBotonTema(); avisar(`Tema ${n === 'sistema' ? 'del sistema' : n}.`); }
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicarTema);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#dlg').open) cerrarDialogo(); });

aplicarTema();
render();
pintarEstado();
window.__babelhubPruebasHumanas = { puntajeSUS, calcular, construirExport, construirMarkdown, fusionar, normalizarDb, buscarDatosPersonales };
})();
</script>
